name: Heartbeat — Cloud PC fired

# Pure observability signal. Whoever performed the daily fire triggers this
# workflow at the END of a successful run, via
#   gh workflow run heartbeat.yml -f at=<iso> -f sha=<head> -f status=success -f host=<who>
# Two emitters exist: the Cloud PC's daily wrapper (host=cloud-pc) and the
# GH Actions production-fire job in daily.yml (host=github-actions).
# The workflow itself does nothing — its mere successful run history IS
# the heartbeat. The liveness monitor (`liveness.yml`) reads
#   gh run list --workflow=heartbeat.yml --branch=main --status=success
# and alerts when the most recent run is older than 25h. Source-agnostic,
# so the cutover (HILMAR_FIRE_FROM_ACTIONS) doesn't touch liveness.
#
# Failure mode: if the Cloud PC can't reach github.com or its PAT
# expired, the wrapper's heartbeat call fails (but the daily email
# already sent — see best-effort treatment in run_daily_laptop.cmd).
# liveness.yml will then file a `cloud-pc-down` issue at 11:30 AM ET.
# Recovery: refresh PAT, re-run wrapper, or manually trigger this
# workflow via Actions UI to clear the alert.

on:
  workflow_dispatch:
    inputs:
      at:
        description: "ISO timestamp of the fire (UTC preferred)"
        required: false
        type: string
      sha:
        description: "Repo HEAD SHA at fire time"
        required: false
        type: string
      status:
        description: "success | partial | failed"
        required: false
        default: "success"
        type: string
      host:
        description: "Identifier of the firing host (e.g. cloud-pc, ttsww)"
        required: false
        default: "cloud-pc"
        type: string
      env:
        description: "Box environment fingerprint (running=.. pinned=.. health=..)"
        required: false
        default: "unknown"
        type: string

jobs:
  record:
    name: Record heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write     # the env-drift sentinel files/closes a labeled issue
    steps:
      - name: Echo heartbeat payload + FAIL the job on a non-success fire
        run: |
          echo "Hilmar daily fire heartbeat received"
          echo "  at:     ${{ github.event.inputs.at }}"
          echo "  sha:    ${{ github.event.inputs.sha }}"
          echo "  status: ${{ github.event.inputs.status }}"
          echo "  host:   ${{ github.event.inputs.host }}"
          echo "  env:    ${{ github.event.inputs.env }}"
          echo ""
          echo "Heartbeat workflow run timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # 2026-06-25 — HONEST heartbeat. The wrapper now passes the REAL fire
          # outcome (from assert_fire_integrity), not a hardcoded "success". A
          # failed/partial fire must produce a FAILED heartbeat run so
          # liveness.yml's `--status=success` query does NOT see it (the run is
          # stale-from-its-perspective) AND its failed-conclusion branch fires.
          # Previously this always succeeded, so a failed send still looked
          # green — the silent-week mechanism.
          status="${{ github.event.inputs.status }}"
          if [ "$status" != "success" ]; then
            echo "::error::Daily fire reported status=$status — failing the heartbeat so liveness flags it."
            exit 1
          fi
          echo "✅ Fire status=success — heartbeat recorded."

      # ENVIRONMENT-DRIFT SENTINEL (2026-06-25). Even when a report shipped
      # successfully, the box may be running a DRIFTED environment (wrong Python
      # / missing deps) — the exact "degraded but it still went out, so nobody
      # noticed for a week" failure mode. The box stamps its env fingerprint via
      # preflight; this step — on GitHub, independent of the box and its MSAL —
      # compares it to the pinned .python-version and files a labeled issue (a
      # notification the operator actually receives) on drift, auto-closing it
      # when the next fire reports healthy. The proactive prevention layer.
      - name: Checkout (read .python-version pin)
        if: ${{ github.event.inputs.host == 'cloud-pc' && github.event.inputs.env != '' && github.event.inputs.env != 'unknown' }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Environment-drift sentinel
        if: ${{ github.event.inputs.host == 'cloud-pc' && github.event.inputs.env != '' && github.event.inputs.env != 'unknown' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ENVFP: ${{ github.event.inputs.env }}
        run: |
          set -e
          envfp="$(echo "$ENVFP" | tr -d '\r')"
          pinned="$(head -n1 .python-version 2>/dev/null | tr -d '[:space:]')"
          running="$(echo "$envfp" | grep -oE 'running=[^ ]+' | cut -d= -f2 || true)"
          health="$(echo "$envfp" | grep -oE 'health=[^ ]+' | cut -d= -f2 || true)"
          drift=""
          if [ -n "$running" ] && [ -n "$pinned" ] && [ "$running" != "$pinned" ]; then
            drift="interpreter is Python $running but the pin is $pinned"
          fi
          if [ -n "$health" ] && [ "$health" != "ok" ]; then
            [ -n "$drift" ] && drift="$drift; "
            drift="${drift}preflight reported health=$health"
          fi
          gh label list --search box-env-drift --json name -q '.[].name' 2>/dev/null \
            | grep -Fxq box-env-drift \
            || gh label create box-env-drift --color D93F0B \
                 --description "Cloud PC fired on a drifted environment" || true
          if [ -z "$drift" ]; then
            echo "✅ Box environment healthy ($envfp) — closing any open drift issue."
            for n in $(gh issue list --label box-env-drift --state open --json number -q '.[].number' 2>/dev/null); do
              gh issue comment "$n" --body "Recovered: box reported a healthy environment (\`$envfp\`) at $(date -u +%FT%TZ). Auto-closing." || true
              gh issue close "$n" || true
            done
            exit 0
          fi
          echo "::warning::Box environment DRIFT — $drift"
          body=$(printf '%s\n' \
            "**The daily fire shipped, but the Cloud PC ran on a DRIFTED environment.**" \
            "" \
            "- Fingerprint: \`$envfp\`" \
            "- Drift: $drift" \
            "- Pinned (.python-version): \`$pinned\`" \
            "- When: $(date -u +%FT%TZ)" \
            "" \
            "The report still went out, but on an environment no test validates — fix it BEFORE it degrades into a silent failure (the 2026-06 root cause). On the Cloud PC: install Python \`$pinned\`, re-run \`deploy/setup_cloudpc.ps1\`, then confirm \`py -$pinned scripts/preflight_env.py\` is green. See docs/RELIABILITY.md." \
            "" \
            "_Auto-closes when the next fire reports a healthy environment._")
          today=$(date -u +%F)
          existing=$(gh issue list --label box-env-drift --state open --search "created:>=$today" --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Box environment drift — fire shipped on an unvalidated env" \
              --label box-env-drift --body "$body"
          fi
          # Out-of-band Teams page (best-effort; clean no-op if the webhook is unset).
          url=$(jq -r '.alerts.teams_webhook_url // ""' config.json)
          if [ -n "$url" ] && [ "$url" != "null" ]; then
            tp=$(jq -n --arg t "Hilmar fire shipped on a DRIFTED environment ($drift; fingerprint $envfp). Fix it before it degrades into a silent failure." '{"@type":"MessageCard","@context":"http://schema.org/extensions","themeColor":"D93F0B","summary":"Box env drift","title":"Hilmar box environment drift","text":$t}')
            curl -sS -o /dev/null -X POST -H "Content-Type: application/json" -d "$tp" "$url" || true
          fi
