name: Daily fire (Cloud PC self-hosted)

# Production daily fire — runs on the Cloud PC's self-hosted GitHub
# Actions runner. Replaces the Windows Task Scheduler trigger; the
# pipeline code itself, the MSAL token cache, the OneDrive state, and
# the secrets/*.txt files all stay exactly where they are.
#
# Why self-hosted:
#   - The Cloud PC already has everything (MSAL token, OneDrive, secrets/).
#     A GH-hosted runner would need state migration first.
#   - OL IT is not engaging on app-only Graph auth yet (2026-05-30), so
#     the existing user-MSAL setup is the auth source.
#   - Windows Task Scheduler is the source of most silent-failure modes
#     (wrapper exit 255, scheduler asleep, etc.). GitHub Actions gives
#     observability, re-run, and manual-trigger semantics without
#     changing a single line of pipeline code.
#
# Setup (one-time): see docs/CLOUD-PC-RUNNER-SETUP.md for installing the
# GitHub Actions runner as a Windows service on the Cloud PC.
#
# Disabling: when you're ready to fully cut over, comment out or delete
# the `on.schedule` block here AND the Windows Task Scheduler job. Until
# both are off, you'll get TWO fires a day (the Task Scheduler one AND
# this one) — outlook_send's idempotency flag prevents double-send, but
# the pipeline runs twice. Pick one trigger.
#
# Safe rollback: this workflow can be disabled via Actions UI → Daily
# fire (Cloud PC self-hosted) → ⋯ → Disable workflow. The Cloud PC's
# Windows Task Scheduler remains as the fallback.

on:
  schedule:
    # 14:00 UTC = 10:00 AM ET in EDT (Mar-Nov).
    # Cron in GH Actions is UTC and doesn't honor DST. In EST (Nov-Mar)
    # this fires at 9:00 AM ET — one hour earlier than current. If the
    # one-hour drift matters, dual-schedule with two cron entries.
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (no email send)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_ingest:
        description: "Skip ingest step (re-render only)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  fire:
    name: Daily Hilmar fire
    runs-on: [self-hosted, Windows, hilmar-cloudpc]
    timeout-minutes: 60       # under Sentry cron max_runtime=60min window
    concurrency:
      # Prevent two fires from overlapping (e.g. if a manual dispatch
      # hits while the cron is mid-run). The newer run waits; never
      # cancels the in-flight one.
      group: daily-fire
      cancel-in-progress: false

    steps:
      # The runner already has the repo cloned at the registered work
      # folder; actions/checkout updates to the latest main commit.
      # This replaces wrapper Step 0 (`git pull` + `xcopy`) entirely:
      # the checkout IS at the SHA being run, no parallel folder to
      # sync. QC-053's drift check will see HEAD == origin/main.
      - name: Checkout (this is the deploy step — no xcopy needed)
        uses: actions/checkout@v4

      # The pipeline code reads secrets from secrets/*.txt on disk
      # (Cloud PC), so we don't need to inject anything from GH
      # secrets — the runner's local filesystem already has them. The
      # OneDrive paths the wrapper uses also resolve identically
      # because the runner runs as the Cloud PC user.

      - name: Refresh stage (pull new Lonny ↔ OL emails)
        # Wrapper Step 1. 14-day window matches the existing wrapper.
        # Failures here don't bail — the pipeline can run on stale stage
        # because additive ingest preserves prior wins.
        run: python scripts\refresh_stage.py --days-back 14
        continue-on-error: true

      - name: Run pipeline
        # Wrapper Step 2. The 16-step orchestrator. Per-step timeouts
        # added in commit 1aa5b53 contain hung steps within the 60-min
        # cron window. If this step fails, downstream send is skipped.
        run: |
          $args = @()
          if ("${{ inputs.skip_ingest }}" -eq "true") { $args += "--skip-ingest" }
          if ("${{ inputs.dry_run }}" -eq "true")    { $args += "--dry-run" }
          python scripts\run_pipeline.py @args

      - name: Send daily email (full distribution)
        # Wrapper Step 3. outlook_send.py has built-in idempotency via
        # reports\sent-YYYY-MM-DD.flag, so double-send is structurally
        # impossible even if cron + Task Scheduler both fire.
        if: inputs.dry_run != 'true'
        run: |
          python scripts\outlook_send.py daily --to-from-config `
            --subject-from-file reports\email-subject.txt `
            --body-from-file reports\email-body.html `
            --attach reports\hilmar-dashboard.html reports\hilmar-report.pdf

      - name: QC alert if needed
        if: always()           # run even if pipeline / send failed
        run: python deploy\qc_alert_if_needed.py

      - name: Teams alerts (WIN, pending overdue, QC error, big day, QC-049)
        # Includes the new qc049_unconfirmed_win event added in PR #8 —
        # opt-in via config.json.alerts.events.
        if: always()
        run: python scripts\teams_alert.py scan
        continue-on-error: true

      - name: Weekly summary (Friday-gated)
        if: always()
        run: python scripts\gen_weekly_summary.py
        continue-on-error: true

      - name: Auto-chase pending
        if: always()
        run: python scripts\auto_chase_pending.py
        continue-on-error: true

      - name: Offline backup (dual-target)
        if: always()
        run: python scripts\backup_offline.py
        continue-on-error: true

      - name: Generate + send improvements audit (idealx.us only)
        # Wrapper Step 5. Private daily systems audit. Always runs so
        # Michael gets the audit even if the production fire bailed.
        if: always()
        run: |
          python scripts\gen_improvements_report.py
          python scripts\outlook_send.py daily --to michael.deitchman@idealx.us `
            --subject-from-file reports\improvements-subject.txt `
            --body-from-file reports\improvements-report.html

      - name: Upload run artifacts
        # 14-day retention. Lets Michael see the day's outputs without
        # logging into the Cloud PC, including from the iPhone Actions
        # app. test-result.json and qc-result.json are the daily green/red
        # signals.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-fire-${{ github.run_id }}
          path: |
            reports\test-result.json
            reports\qc-result.json
            reports\drift-result.json
            reports\improvements-report.html
            reports\email-subject.txt
            reports\deployment-sha.txt
            reports\quote-tracker-sync.log
          retention-days: 14
          if-no-files-found: warn
