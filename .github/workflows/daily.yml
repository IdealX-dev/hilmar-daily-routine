name: Daily

# Two jobs (plus a schedule gate):
#   - `audit` (scheduled + manual): runs the test+coverage routine, captures
#     artifacts, reports green/red. Always on.
#   - `production-fire`: the REAL daily fire, fully wired — pulls state from
#     blob, runs the 16-step pipeline with app-only Graph auth, sends to the
#     full distribution as the shared mailbox, pushes state back, emits the
#     liveness heartbeat. Moving the fire here kills the git-pull + xcopy
#     silent-failure chain that the Cloud PC depends on.
#
# How production-fire triggers:
#   - Manual dispatch with mode=production-fire. `send_to` defaults to `test`
#     (Michael only) so a verification dispatch can NEVER hit the 10-recipient
#     distribution by accident — pick send_to=full deliberately.
#   - On schedule, ONLY when the repo variable HILMAR_FIRE_FROM_ACTIONS is
#     set to 'true' (Settings → Secrets and variables → Actions → Variables).
#     That variable IS the cutover switch: setting it moves the daily fire
#     here; unsetting it rolls back to the Cloud PC. No YAML edit needed.
#
# Graph auth (2026-06-10): OL IT declined to register an app-only Entra
# app, so the default auth is DELEGATED — the same device-code token the
# Cloud PC uses, synced through the blob store (state_store pulls it before
# the fire, pushes the refreshed cache after; daily refresh keeps the
# ~90-day refresh token alive indefinitely). The GRAPH_APP_* secrets remain
# supported and take precedence if OL ever registers the app.
#
# To cut over from the Cloud PC to GH Actions:
#   1. Secrets needed: SENTRY_DSN, SENTRY_AUTH_TOKEN, ANTHROPIC_API_KEY,
#      QT_APP_PASSWORD, AZURE_STORAGE_CONNECTION_STRING.
#   2. Seed state ONCE from the Cloud PC (uploads tracking data, stage
#      cache, and the token cache to the blob store):
#        $env:AZURE_STORAGE_CONNECTION_STRING = "<the same value as the secret>"
#        python scripts\state_store.py push
#   3. Dispatch once with mode=production-fire, send_to=test — a full real
#      fire that emails ONLY michael.deitchman@idealx.us for verification.
#      The validator's silent-refresh check is also the Conditional Access
#      verdict: if OL blocks token refresh from GitHub IPs, it fails THERE
#      with a plain-English message, and off-Cloud-PC firing needs OL.
#   4. When clean: disable the Cloud PC's "Hilmar Daily Tracker - CloudPC"
#      scheduled task FIRST, then set HILMAR_FIRE_FROM_ACTIONS=true. Order
#      matters — sent-flags are per-machine, so two live schedules would
#      BOTH send to the client (see docs/MOVE-OFF-CLOUDPC.md).

on:
  # Michael 2026-07-21: "get rid of the recaps and just do daily at 8am est for
  # the day before." ONE fire: Mon-Fri ~8:07 AM ET, each reporting the PRIOR
  # business day (window=previous: Mon→Fri, Tue→Mon, Wed→Tue, Thu→Wed, Fri→Thu).
  # No Friday wrap-up, no weekend fire — every business day is reported exactly
  # once, the next business morning. The email labels its KPIs "for <prior day>".
  # Supersedes the 2026-07-18 morning+wrap-up cadence (which left Monday morning
  # structurally empty, since the Friday wrap-up pre-covered Friday).
  #
  # GitHub cron is runner-backed (doesn't depend on the Cloud PC) and can land
  # 2-4h late — fine for a morning fire, since the prior day is already complete.
  #
  # DST: the fire has a cron for BOTH UTC encodings; the gate proceeds on exactly
  # the one matching the current ET offset, so DST never doubles or skips.
  #   8 AM ET = 12 UTC (EDT) / 13 UTC (EST)
  # RESUMED 2026-08-13 (Michael: "ol usa reponses you won't see for most for
  # lat two months.. you'll see them going forward so set your chrons back up
  # to work as of now"). BOTH halves restored together, per the 2026-08-03
  # lesson: the cron lines below AND HILMAR_REPORTS_PAUSED="false".
  #
  # The pause it ends began 2026-08-12: "turn off all reports going out until
  # you finally figure out where you made system changes in the last month
  # that the report is all wrong still". What was found and fixed in between
  # is in CHANGELOG 2026-08-13 (1)(2) — the win set now reconciles to OL's
  # own 2026 book (133 wins), 12 phantom wins are out, and the turnaround
  # clock is off and says so on the report.
  #
  # KNOWN AND ACCEPTED, not a defect to chase: OL-USA RESPONSES will be
  # sparse for roughly Jun-Aug. OL's replies went To: Lonny, Cc: the group
  # and never reached this mailbox; forwarding was fixed 2026-08-12, so the
  # section fills from here forward. Michael, above.
  # MOVED EARLIER 2026-08-27 (Michael: "blast did not go out today" then
  # "move cron earlier"). On 08-27 GitHub dropped the 12:07 tick entirely and
  # started the run at 15:54 UTC — 3h47m late — so the blast landed at
  # 12:12 PM ET instead of ~8 AM. Nothing failed; the scheduler simply
  # slipped, which the note above already says it can do by 2-4h.
  #
  # 6:30 AM ET, NOT EARLIER, AND THE 30 MINUTES ARE LOAD-BEARING.
  # core.report_business_day treats ANY fire before 6:00 AM ET as belonging
  # to the PRIOR business day (the wee-hours rule, core.py). Combined with
  # window=previous, a 5 AM Thursday fire would report TUESDAY and skip
  # Wednesday — every day, silently, forever. Verified before moving:
  #     05:07 ET -> business day 2026-08-26   (WRONG: skips a day)
  #     06:07 ET -> business day 2026-08-27   (correct)
  # GitHub cron only ever fires LATE, never early, so 6:30 keeps a 30-minute
  # cushion above the cliff. tests/test_cron_respects_the_wee_hours_cutoff.py
  # fails if any cron here is ever set below it.
  schedule:
    - cron: "30 10 * * 1-5"   # ~6:30 AM EDT, Mon-Fri
    - cron: "30 11 * * 1-5"   # ~6:30 AM EST, Mon-Fri (gated out in EDT)
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "audit-only"
        type: choice
        options:
          - audit-only        # Tests + coverage + dry-run (today's default)
          - production-fire   # The real daily fire
      send_to:
        description: "production-fire recipients (test = Michael only)"
        required: false
        default: "test"
        type: choice
        options:
          - test              # michael.deitchman@idealx.us only — safe default
          - full              # the 10-recipient client distribution
      force_resend:
        description: "Override today's already-sent flag (re-send even if the daily email already went out). Manual dispatch ONLY — scheduled fires never force."
        required: false
        default: false
        type: boolean
      days_back:
        description: "refresh_stage window in days (default 14). The 2026-08-12 verification catch-up uses 21 so W31's real OL replies (Jul 27-31 asks) come back into stage."
        required: false
        default: "14"
        type: string

# Serialize Daily runs so the multiple morning ticks (and any manual
# dispatch) can't run concurrently and race the blob state push/pull.
# cancel-in-progress:false — NEVER cancel a fire mid-send; queue instead.
# The first run sends; queued ones reach the mailbox guard and no-op.
concurrency:
  group: hilmar-daily-fire
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────
# REPORTS HARD-STOPPED — 2026-08-12. Michael: "turn off all reports going
# out until you finally figure out where you made system changes in the
# last month that the report is all wrong still." (After the Aug-12 email
# surfaced QC-077's 49 undated quotes to the CEO.) Zero goes out: the flag
# below blocks EVERY trigger including manual dispatch, and the cron
# triggers are removed so no run can spawn from a pre-pause SHA.
#
# Previously: LIVE since 2026-08-04 ("crons back on").
#
# History, because the next pause should be cheaper than the last one:
#   2026-07-30  "pause all hilmar reports" — flag set to "true".
#   2026-08-03  "why is hilmar still sending  just sent again  make it
#               stop  zero to go out". The flag was right and insufficient:
#               a scheduled run pins its SHA when it SPAWNS, so the weekly
#               that fired at 12:33 was running the pre-pause file and
#               never saw the gate. Removing the cron triggers was the
#               only thing that produced zero.
#   2026-08-04  Azure writes recovered ("AZURE IS BACK AND RUNNING"), the
#               backfill pushed state successfully for the first time
#               since 2026-07-27 18:29, and the crons came back.
#
# TO PAUSE AGAIN, BOTH HALVES OR NEITHER:
#   1. set HILMAR_REPORTS_PAUSED: "true" below (and in weekly.yml and
#      liveness.yml — tests assert all three agree), AND
#   2. comment out the cron triggers above.
# The flag alone stops future spawns from seeing an open gate; removing the
# triggers stops the spawn. tests/test_audit_batch8.py enforces the pairing
# so a half-pause fails CI instead of failing in Lonny's inbox.
#
# While paused, liveness stands down rather than alarming: a watchdog that
# pages about a silence you chose is one you learn to ignore.
# ─────────────────────────────────────────────────────────────────────
env:
  # verify_only, WITH the crons live (Michael 2026-08-13: "just resume
  # running the report and only to myself until i approve it.. but you
  # should be checking and scanning emails is what i meant"). The daily
  # sweep runs and OL's mail keeps entering the tracker; every send goes to
  # Michael alone. Flip to "false" only when he approves the content.
  HILMAR_REPORTS_PAUSED: "false"
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  HILMAR_PARSER_FALLBACK_DISABLE: "1"

jobs:
  gate:
    name: Schedule gate (6:30 AM Mon-Fri ET, reports the prior business day)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      window: ${{ steps.decide.outputs.window }}
    steps:
      - id: decide
        # The daily fire ALWAYS reports the prior business day (window=previous)
        # — there is no evening wrap-up anymore. A scheduled tick proceeds iff
        # its UTC HOUR matches the current ET DST season (12 EDT / 13 EST);
        # keying on offset, not wall-clock, so GitHub's multi-hour cron lateness
        # can never skip a day or run the wrong DST set. Manual dispatch always
        # proceeds (and also reports the prior business day).
        run: |
          echo "window=previous" >> "$GITHUB_OUTPUT"
          # HARD STOP, checked before anything else, for EVERY event type.
          # Michael 2026-08-03: "make it stop  zero to go out". Gating the
          # schedule alone is not enough — "zero" means a manual dispatch
          # cannot send either, so this is checked before the dispatch branch
          # below. Setting HILMAR_REPORTS_PAUSED=true is HALF a stop on its
          # own: a run already spawned from a pre-pause SHA carries its own
          # copy of this file, so the cron triggers must come out too (that is
          # how 2026-08-03's weekly still fired 24 minutes after the pause
          # merged). tests/test_audit_batch8.py enforces the pairing.
          # RESUMED 2026-08-04 — Michael: "crons back on".
          if [ "$HILMAR_REPORTS_PAUSED" = "true" ]; then
            echo "::warning::Hilmar reports are HARD-STOPPED (HILMAR_REPORTS_PAUSED=true). Nothing will be sent by ANY trigger, including manual dispatch."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # VERIFY-ONLY. REDEFINED 2026-08-13 by Michael: "just resume running
          # the report and only to myself until i approve it.. but you should
          # be checking and scanning emails is what i meant."
          #
          # It used to block the schedule outright, which also stopped the
          # DAILY MAIL SCAN — and the scan is the thing that must not stop,
          # because OL's replies only enter the tracker if the sweep runs the
          # day they arrive. So verify_only now means: RUN on the normal
          # schedule, scan mail, build everything — and send ONLY to Michael.
          # send_to=full is refused from any trigger, and the SEND_TO export
          # further down forces "test" regardless of what the trigger asked
          # for, so a client-facing send is unreachable in this state, not
          # merely discouraged.
          #
          # The hard stop above is unchanged and is still the way to stop
          # everything including the scan.
          #
          # Checked BEFORE the open-dispatch branch below, same reason the
          # hard stop is — an opening checked too late is not a gate.
          # It REFUSES send_to=full and then FALLS THROUGH — it must not
          # short-circuit proceed=true on a schedule, because the DST
          # cron-matching below is what picks exactly one of the two cron
          # encodings. Returning early here would fire the pipeline twice
          # every day, once per encoding.
          if [ "$HILMAR_REPORTS_PAUSED" = "verify_only" ] \
             && [ "${{ github.event.inputs.send_to }}" = "full" ]; then
            echo "::warning::verify_only — send_to=full refused. Only Michael receives anything in this state."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual dispatch — gate open (window=previous)."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          offset=$(TZ=America/New_York date +%z)   # -0400 in EDT, -0500 in EST
          cron="${{ github.event.schedule }}"
          cron_hour=$(echo "$cron" | awk '{print $2}')   # field 2 of "M H * * D"
          proceed=false
          # THESE TWO HOURS MUST MATCH THE `cron:` LINES ABOVE. They did not,
          # from #228 (2026-08-27) until 2026-08-30: that PR moved the crons
          # to 10:30/11:30 UTC (6:30 AM ET) and left this matcher on the OLD
          # 12/13, so NEITHER cron could open the gate and every scheduled
          # fire skipped itself. Both of Friday 08-28's scheduled runs went
          # green in seconds having sent nothing —
          #   cron='30 11 * * 1-5' hour=11 ET-offset=-0400 -> proceed=false
          # — and the report only reached the distribution because someone
          # dispatched it by hand at 17:31 UTC. Green, silent, and not firing:
          # the exact shape of the 2026-08-20 `|| true` diagnostic.
          #
          # tests/test_cron_respects_the_wee_hours_cutoff.py now DERIVES both
          # numbers from the cron lines and fails if they drift apart, so the
          # next person to move the fire time cannot leave this behind.
          if [ "$offset" = "-0400" ] && [ "$cron_hour" = "10" ]; then proceed=true; fi
          if [ "$offset" = "-0500" ] && [ "$cron_hour" = "11" ]; then proceed=true; fi
          echo "cron='$cron' hour=$cron_hour ET-offset=$offset → proceed=$proceed window=previous"
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  audit:
    name: Daily test + coverage audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    # Only for an explicit audit-only dispatch. A production fire does NOT run
    # this — the pipeline already runs the same test+coverage routine internally
    # (QC-052 via run_audit_tests), so a separate audit job here just doubled
    # the test-suite compute on every fire (2026-06-19 trim).
    if: needs.gate.outputs.proceed == 'true' && github.event.inputs.mode == 'audit-only'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            reportlab msal requests tzdata pdfplumber \
            sentry-sdk jsonschema python-dateutil jinja2 anthropic \
            pytest pytest-cov responses

      - name: Run the test + coverage routine
        # Same script the Cloud PC runs as the first pipeline step (QC-052).
        # Writes reports/test-result.json with status, gate, per-module
        # coverage, untested modules.
        run: python3 scripts/run_audit_tests.py

      - name: Upload artifacts
        # The audit artifacts are how Michael verifies "what did the daily
        # run actually see". On the Cloud PC they live in OneDrive; on GH
        # Actions they need explicit upload to be reviewable.
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: daily-audit-${{ github.run_id }}
          path: |
            reports/test-result.json
            reports/coverage.json
            reports/qc-result.json
          retention-days: 14
          if-no-files-found: warn

      - name: Surface failure to the GH check
        if: failure()
        run: |
          echo "::error::Daily audit run failed — see test-result.json artifact"
          if [ -f reports/test-result.json ]; then
            python3 -c "import json; d=json.load(open('reports/test-result.json')); print(f\"status={d.get('status')} tests_ok={d.get('tests_ok')} coverage={d.get('total_coverage')}%\")"
          fi

  production-fire:
    name: Production fire
    # The daily fire. Runs on the ~6 PM ET schedule (the reliable trigger), on a
    # manual dispatch with mode=production-fire, and on liveness.yml's
    # auto-recovery dispatch. A scheduled run always sends to the full list
    # (SEND_TO below); the same-day sent-flag makes any overlap idempotent.
    if: >-
      needs.gate.outputs.proceed == 'true' &&
      (github.event_name == 'schedule' ||
       github.event.inputs.mode == 'production-fire')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Depends on `gate` only — NOT the audit job (which is skipped for a fire),
    # so production-fire runs without a duplicate test-suite job.
    needs: [gate]
    permissions:
      contents: read
      actions: write     # to dispatch heartbeat.yml at end of a full fire
      # 2026-07-27: the fire could not raise its own alarm. fire_alert's
      # GitHub-issue channel needs BOTH this permission and GH_TOKEN (below);
      # it had neither, so on a failed fire send_alert returned
      # {'github': False, 'teams': False} and the FIRE-ALERT reached only
      # stderr (buried in a log) and a queue file on an ephemeral runner that
      # is destroyed with it. Nobody was told. Proved on the 2026-07-27 fire.
      issues: write      # to file the FIRE-ALERT issue when a fire fails
    # All Graph + service secrets are exposed to every step that needs them.
    # App-only Graph (GRAPH_APP_*) is consumed by GraphClient.authenticate()
    # and outlook_send._app_only_send_context(); state sync uses the blob
    # connection string. The pipeline reads the rest from env via the same
    # paths the Cloud PC reads secrets/*.txt.
    env:
      # THE ALARM'S CREDENTIAL. fire_alert._github_issue tries `gh issue
      # create` then the REST API; both need a token, and neither the pipeline
      # step nor the integrity-gate step had one. Set at JOB level so every
      # step that can raise a FIRE-ALERT can actually deliver it — a failing
      # fire now opens a labeled issue immediately, instead of depending
      # entirely on the liveness watchdog (which runs on the same GitHub
      # runners and therefore fails the same way: on 2026-07-27 the fire and
      # both liveness ticks all failed to get a runner within one hour).
      GH_TOKEN: ${{ github.token }}
      GRAPH_APP_TENANT_ID: ${{ secrets.GRAPH_APP_TENANT_ID }}
      GRAPH_APP_CLIENT_ID: ${{ secrets.GRAPH_APP_CLIENT_ID }}
      GRAPH_APP_CLIENT_SECRET: ${{ secrets.GRAPH_APP_CLIENT_SECRET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      QT_APP_PASSWORD: ${{ secrets.QT_APP_PASSWORD }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      # Historian — the durable longitudinal quote store behind rate trends
      # and win-rate history. 2026-07-11 (Michael "you handle turso tokens...
      # i cannot read this as it works"): NO Turso, no tokens — a plain
      # sqlite file synced through the SAME blob store as the rest of the
      # pipeline state (state_store pulls it pre-fire, historian appends,
      # state_store pushes it back). Live from the first fire with zero
      # owner action.
      HILMAR_HISTORIAN_SQLITE: data/quote-history.db
      # Scheduled fires are always the real thing; dispatches honor send_to
      # (default test — Michael only).
      SEND_TO: ${{ github.event_name == 'schedule' && 'full' || github.event.inputs.send_to }}
      # Operator override for the per-day idempotency flag. ONLY a manual
      # dispatch can set it (scheduled fires can't pass inputs, so this is
      # always empty on a schedule → a scheduled fire NEVER force-sends and
      # can never double-send the client list). Use when a stale/earlier flag
      # is wrongly suppressing today's real send (e.g. the 2026-06-16 mid-day
      # cutover hangover).
      FORCE_RESEND: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_resend || 'false' }}
      # Never let a failed silent refresh fall into the interactive
      # device-code prompt — on a headless runner that blocks until the
      # job times out. Fail loudly instead.
      HILMAR_NONINTERACTIVE: "1"
      # Read MBD_OceanExportBookingShared ONLY, not michael.deitchman@ol-usa.com.
      # Michael 2026-08-14: "stop checking my ol emails and use your direct
      # connection to the shared box." The shared mailbox is where OL sends and
      # is already the authoritative copy in the dedupe; /me was mostly
      # duplication (3,636 already-staged against 4 new on the 60-day sweep)
      # plus 23,724 unclassified items from a personal mailbox carrying every
      # non-Hilmar thread he is on.
      #
      # Set here as well as defaulted in refresh_stage so the choice is visible
      # where the fire is configured. Flip to "false" to put /me back — no code
      # change. If the Mail.Read.Shared token ever lapses, refresh_stage still
      # falls back to /me rather than reading nothing.
      #
      # SET BACK TO "false" 2026-08-14, ~30 minutes later, on evidence. The
      # shared mailbox is NOT READABLE and never has been. Every Graph call
      # against it has failed:
      #     403 ErrorAccessDenied  "Access is denied. Check credentials"
      #     404 ErrorItemNotFound  "Default folder AllItems not found"
      # The 08-13 run that appeared to prove shared access only proved the
      # TOKEN carries Mail.Read.Shared; read_targets listed the mailbox and
      # every actual read 403'd, so all 27,500 messages that day came from
      # /me. With shared-only set, the 10:41 fire swept 0 messages and staged
      # 0 records — the tracker was blind.
      #
      # PROBED endpoint-by-endpoint on 2026-08-14 (diag_shared_mailbox, run
      # 31806028826) after Michael pushed back that the authorization WAS
      # granted. He was right about the authorization, and the earlier
      # "distribution group" theory written here was wrong:
      #
      #   directory object : PASS — 'MBD Ocean Export Booking (Shared)'
      #   folder list      : 404  "Default folder Root not found"
      #   inbox read       : 404  "Default folder Inbox not found"
      #   sentitems read   : 404  "Default folder SentItems not found"
      #   /messages        : 404  "Default folder AllItems not found"
      #
      # A real, named shared-mailbox object; token acquired with
      # Mail.Read.Shared; and Graph finds NO folder store behind it — not
      # even Root. That is past the permission layer: the errors are
      # store-level, not access-level — or so it appears. Michael 2026-08-14:
      # "they use exchange online... we do not run on our own servers at ol",
      # which kills the on-prem/hybrid theory that briefly stood here.
      #
      # RE-PROBED 2026-08-26, run 33018399015 — twelve days on, byte-for-byte
      # the same five lines. Nothing has changed; no grant has been made.
      #
      # AND LOOKED UP, for the first time (CLAUDE.md names this as the
      # standing case: "guessed at twice and looked up zero times"). The
      # developer index and Microsoft's own docs both carry this exact
      # string as the standard symptom of a shared mailbox the caller has
      # no delegation on — Zammad's Graph troubleshooting page states it
      # outright, and "About shared mailboxes in Microsoft 365" says
      # "Delegate access must be done through the delegate's own mailbox",
      # which is the Full Access grant described below. So the theory below
      # is [Likely] on evidence rather than on reasoning alone.
      #
      # ONE RIVAL READING SURVIVES, and it matters because it points at a
      # different owner: the identical error is also what Graph returns for
      # a mailbox with NO STORE behind it — a user mailbox disconnected
      # after its licence was removed, which Exchange does automatically.
      # Both produce ErrorItemNotFound on Root. Nothing reachable from this
      # repo tells them apart; one command in OL's Exchange admin does
      # (Get-Mailbox on the address: no result = no store, a result = the
      # grant is missing). Ask for that alongside the OWA test below.
      #
      # The remaining explanation that fits EVERYTHING observed [Likely,
      # now with documentation behind it]: Exchange Online answers 404
      # "not found" instead of 403
      # "access denied" for a mailbox the signed-in user lacks FULL ACCESS to
      # — it hides the mailbox rather than admit it exists. Being on the
      # group's DISTRIBUTION (which is why /me receives the mail) grants no
      # mailbox permission at all; Full Access is a separate per-mailbox
      # grant in Exchange admin, on a different screen from the Entra app
      # consent that WAS approved. Mail.Read.Shared only unlocks what the
      # user could already open.
      #
      # The decisive test needs no IT: OWA -> "Open another mailbox" ->
      # MBD_OceanExportBookingShared@ol-usa.com. Opens = theory wrong, keep
      # digging. Refuses = confirmed; the fix is OL IT granting Michael's
      # account Full Access (read) on that mailbox, after which this token
      # and this code read it with no further change. Re-run
      # diag_shared_mailbox after any grant before believing anything.
      # /me remains the working intake either way — the group's mail lands
      # there via the distribution, as it always has.
      HILMAR_READ_SHARED_ONLY: "false"
      # Report window (2026-07-21): the gate ALWAYS emits "previous" — the
      # single 8 AM fire reports the prior business day; there is no fire-time
      # or day-of-week branching anymore. core.py's default stays "current";
      # this env var is where the gate's value flows into the pipeline.
      HILMAR_REPORT_WINDOW: ${{ needs.gate.outputs.window }}
      # Skip the in-pipeline pytest+coverage routine: the dedicated test.yml CI
      # workflow already runs the full suite on every push/PR (the authoritative
      # gate), so re-running it under coverage here is redundant — and on a
      # runner it times out even at 600s, wasting ~10min and spamming Sentry
      # (it's best-effort so it never blocked the fire, but it's pure noise).
      HILMAR_SKIP_PIPELINE_TESTS: "1"
    steps:
      - name: Verify prerequisites — refuse to fire if anything's missing
        # The pipeline silently degrades on missing secrets, so we hard-fail
        # here BEFORE the fire to make a misconfiguration loud. GRAPH_APP_*
        # is deliberately NOT required: OL declined to register the app-only
        # Entra app (2026-06-10), so the default auth is the delegated token
        # cache pulled from the blob store — validated for real below.
        run: |
          missing=0
          for v in SENTRY_DSN ANTHROPIC_API_KEY AZURE_STORAGE_CONNECTION_STRING; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not set — production-fire blocked"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::Refusing to fire — set the secrets in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "All required secrets present. SEND_TO=$SEND_TO"

      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            reportlab msal requests tzdata pdfplumber \
            sentry-sdk jsonschema python-dateutil jinja2 anthropic \
            azure-storage-blob pytest pytest-cov responses

      - name: Materialize secret files the pipeline reads from secrets/*.txt
        # Several modules read secrets/<name>.txt directly (sentry_setup,
        # model_router, sync_to_quote_tracker). Write them from env so the
        # GH Actions run matches the Cloud PC's on-disk layout. The dir is
        # gitignored; these files live only for this job's lifetime.
        run: |
          mkdir -p secrets
          printf '%s' "$SENTRY_DSN"        > secrets/sentry-dsn.txt
          printf '%s' "$SENTRY_AUTH_TOKEN" > secrets/sentry-auth-token.txt
          printf '%s' "$ANTHROPIC_API_KEY" > secrets/anthropic-api-key.txt
          printf '%s' "$QT_APP_PASSWORD"   > secrets/quote-tracker-pwd.txt

      - name: Pull pipeline state from blob store
        # tracking-data-v2.json + staged email cache + the delegated token
        # cache + today's sent-flags from the prior fire. The flags make
        # idempotency machine-independent: a second dispatch today sees the
        # flag and refuses to double-send. Pulled BEFORE validation so the
        # validator can test the token cache it just received.
        run: python3 scripts/state_store.py pull

      - name: Snapshot backup to blob store
        id: snapshot
        # Dated gzip of the just-pulled state — i.e. yesterday's end-state,
        # before today's fire mutates it. QC-032's durable target on this
        # host (the OneDrive/local backup dirs only exist on the Cloud PC).
        #
        # NON-FATAL SINCE 2026-07-30, AND THAT IS THE POINT.
        # This is a SAFETY NET, not the product. It ran under the default
        # `bash -e`, so when the blob store started refusing writes on
        # 2026-07-27 (reads and listing still fine — every write 404s
        # account-wide; see scripts/diag_blob.py) this step exited 1 and took
        # the whole job with it. Steps 9-13 — validate, run the pipeline,
        # SEND THE DAILY EMAIL, send the client email, integrity gate — were
        # all skipped. Three business days of client reports were lost to a
        # failing backup, which is strictly worse than a missing snapshot.
        #
        # The failure stays LOUD, it just stops being fatal: the next step
        # raises an out-of-band alert, and QC-032 independently errors on a
        # stale backup during the run's own audit, so a silently-missing
        # snapshot cannot hide. What must never happen again is a safety net
        # holding the client report hostage.
        continue-on-error: true
        run: python3 scripts/state_store.py backup

      - name: Say so if the snapshot backup failed
        if: steps.snapshot.outcome == 'failure'
        # Belt and braces: an ALERT step must never be the thing that kills
        # the fire. `|| true` below already guarantees exit 0, but a future
        # edit that drops it would silently re-arm the exact failure mode
        # this whole change exists to remove.
        continue-on-error: true
        # Out-of-band, because the lesson of 2026-07-27 is that an alarm
        # riding the failing subsystem is no alarm. fire_alert exits 1 when
        # no REMOTE channel took the alert, and a dead alarm must not become
        # a dead fire — QC-076 covers that case separately.
        run: |
          python3 scripts/fire_alert.py \
            --level warning \
            --title "Snapshot backup FAILED — fire continuing without it" \
            --body "state_store.py backup exited non-zero on run ${{ github.run_id }}. The fire is proceeding deliberately: a failed snapshot must not block the client report (2026-07-30). State is NOT backed up for this run — check the blob store's write path, and see QC-032 in this run's audit for backup staleness." \
            || true

      - name: Validate prerequisites for real — name any wrong secret
        # The non-empty loop above can't catch a wrong-field paste (storage
        # Key instead of Connection string, a non-GUID tenant id) — those
        # died mid-run as SDK tracebacks on 2026-06-10. This does one cheap
        # real check per item and says exactly what to fix, including a live
        # silent-refresh of the delegated token (which is also the
        # Conditional Access verdict for firing from GitHub's IPs). Read-only.
        run: python3 scripts/verify_fire_prereqs.py

      - name: Run the daily pipeline (app-only Graph auth)
        # refresh_stage reads the OL/Lonny thread via app-only Graph; the
        # 16-step pipeline ingests → QC → renders. GRAPH_APP_* in env routes
        # GraphClient to the app-only path automatically. Capture the
        # pipeline's true exit code so the integrity gate below can assert on
        # it (rather than assuming success by reaching the last line).
        id: pipeline
        env:
          DAYS_BACK: ${{ github.event.inputs.days_back || '14' }}
        run: |
          python3 scripts/refresh_stage.py --days-back "${DAYS_BACK}"
          rc=0
          python3 scripts/run_pipeline.py || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error::run_pipeline.py exited rc=$rc"
            exit "$rc"
          fi

      - name: Send the daily email + audit
        # outlook_send picks /users/{SEND_MAILBOX}/sendMail because GRAPH_APP_*
        # is set. Full sends are idempotent via reports/sent-YYYY-MM-DD.flag
        # (synced through the blob store). Verification sends go to Michael
        # only and use --no-flag so they never touch production idempotency
        # state — a test must never block or unblock the real send.
        #
        # ONE-EMAIL MODEL (Michael 2026-07-15: "the 3 reports should be made
        # into one and emailed to everyone as pdfs"): the audit is generated
        # FIRST, then gen_combined_pdf merges tracker + client-copy + audit
        # into reports/hilmar-combined.pdf, and ONE email carries it to the
        # staff list — no separate audit email. FALLBACK: if the combined PDF
        # fails to build, ship the old way (tracker PDF attached + separate
        # audit email) so a rendering bug can never cost the daily deliverable.
        # Lonny's client email (next step) is unchanged either way — QC-065.
        run: |
          # Optional attachments beyond the dashboard + PDF: the auto-updated
          # user manual (every day, if it built) and the Friday executive
          # summary — attached ONLY when generated fresh this run, so a stale
          # copy from a prior Friday can never ride a Monday email.
          EXTRA_ATTACH=""
          [ -f reports/user-manual.html ] && EXTRA_ATTACH="reports/user-manual.html"
          if [ -f reports/weekly-summary.html ] && find reports/weekly-summary.html -mmin -120 | grep -q .; then
            EXTRA_ATTACH="$EXTRA_ATTACH reports/weekly-summary.html"
          fi
          echo "extra attachments: ${EXTRA_ATTACH:-none}"
          # Audit BEFORE the send so its content can ride the combined PDF.
          python3 scripts/gen_improvements_report.py
          COMBINED_OK=false
          if python3 scripts/gen_combined_pdf.py; then
            COMBINED_OK=true
            MAIN_PDF="reports/hilmar-combined.pdf"
          else
            echo "::warning::gen_combined_pdf failed — falling back to the 3-email model this run"
            MAIN_PDF="reports/hilmar-report.pdf"
          fi
          # SECOND LOCK on the client distribution. The gate refuses an
          # explicit send_to=full under verify_only, but a SCHEDULED fire
          # never passes send_to at all and the expression above resolves it
          # to "full". Michael 2026-08-13 wants the schedule to run and scan
          # mail while every send goes to him alone, so verify_only rewrites
          # SEND_TO here, where the flag is a real shell variable.
          if [ "$HILMAR_REPORTS_PAUSED" = "verify_only" ]; then
            SEND_TO=test
            echo "verify_only — SEND_TO forced to 'test' (Michael only)."
          fi
          if [ "$SEND_TO" = "full" ]; then
            # FORCE_RESEND=true (manual dispatch only) overrides the per-day
            # already-sent flag. We use --force (NOT --no-flag) so the send is
            # still recorded — a later un-forced run won't re-send again. This
            # is the recovery lever for a stale/earlier flag wrongly suppressing
            # today's real send.
            FORCE_FLAG=""
            if [ "$FORCE_RESEND" = "true" ]; then
              FORCE_FLAG="--force"
              echo "⚠️  FORCE_RESEND=true — overriding today's already-sent idempotency flag"
            fi
            echo "FULL distribution send (config.json distribution.full_list) — PDF=$MAIN_PDF"
            python3 scripts/outlook_send.py daily --to-from-config $FORCE_FLAG \
              --subject-from-file reports/email-subject.txt \
              --body-from-file reports/email-body.html \
              --attach reports/hilmar-dashboard.html "$MAIN_PDF" $EXTRA_ATTACH
            if [ "$COMBINED_OK" != "true" ]; then
              python3 scripts/outlook_send.py daily --to michael.deitchman@idealx.us $FORCE_FLAG \
                --subject-from-file reports/improvements-subject.txt \
                --body-from-file reports/improvements-report.html
            fi
          else
            echo "VERIFICATION send — michael.deitchman@idealx.us only (send_to=test) — PDF=$MAIN_PDF"
            python3 scripts/outlook_send.py daily --to michael.deitchman@idealx.us \
              --verification \
              --subject-from-file reports/email-subject.txt \
              --body-from-file reports/email-body.html \
              --attach reports/hilmar-dashboard.html "$MAIN_PDF" $EXTRA_ATTACH
            if [ "$COMBINED_OK" != "true" ]; then
              python3 scripts/outlook_send.py daily --to michael.deitchman@idealx.us \
                --verification \
                --subject-from-file reports/improvements-subject.txt \
                --body-from-file reports/improvements-report.html
            fi
          fi

      - name: Send the client-facing email (gated)
        # The CLIENT-facing daily service update (gen_client_email.py →
        # reports/client-email-*.{html,txt}). SHIPS GATED OFF: only when
        # config.json client_report.enabled=true AND this is a full production
        # send does it go to the client recipients (with --flag-name
        # client-sent, its own idempotency namespace, synced via state_store).
        # Otherwise a SAMPLE goes to sample_to (Michael only) with
        # --verification, which tags the subject [VERIFY] and implies
        # --force --no-flag so it never touches idempotency state AND can
        # never consume the real client send's mailbox guard. QC-065 pins the
        # approved to/cc and scans the body for internal-analytics leaks.
        # BEST-EFFORT: this step must never fail the job — the staff email has
        # already shipped by this point; every branch exits 0.
        run: |
          set +e
          ENABLED=$(python3 -c "import json; print(str(json.load(open('config.json')).get('client_report', {}).get('enabled', False)).lower())" 2>/dev/null || echo "false")
          CLIENT_TO=$(python3 -c "import json; print(' '.join(json.load(open('config.json')).get('client_report', {}).get('to', [])))" 2>/dev/null || echo "")
          CLIENT_CC=$(python3 -c "import json; print(' '.join(json.load(open('config.json')).get('client_report', {}).get('cc', [])))" 2>/dev/null || echo "")
          SAMPLE_TO=$(python3 -c "import json; print(' '.join(json.load(open('config.json')).get('client_report', {}).get('sample_to', ['michael.deitchman@idealx.us'])))" 2>/dev/null || echo "michael.deitchman@idealx.us")
          if [ ! -f reports/client-email-body.html ] || [ ! -f reports/client-email-subject.txt ]; then
            echo "Client-facing email artifacts missing (best-effort build step failed?) — skipping."
            exit 0
          fi
          # SECOND LOCK on the client distribution. The gate refuses an
          # explicit send_to=full under verify_only, but a SCHEDULED fire
          # never passes send_to at all and the expression above resolves it
          # to "full". Michael 2026-08-13 wants the schedule to run and scan
          # mail while every send goes to him alone, so verify_only rewrites
          # SEND_TO here, where the flag is a real shell variable.
          if [ "$HILMAR_REPORTS_PAUSED" = "verify_only" ]; then
            SEND_TO=test
            echo "verify_only — SEND_TO forced to 'test' (Michael only)."
          fi
          if [ "$ENABLED" = "true" ] && [ "$SEND_TO" = "full" ] && [ -n "$CLIENT_TO" ]; then
            echo "CLIENT send — client_report.enabled=true and send_to=full → TO=$CLIENT_TO CC=$CLIENT_CC"
            python3 scripts/outlook_send.py daily --to $CLIENT_TO --cc $CLIENT_CC \
              --flag-name client-sent \
              --subject-from-file reports/client-email-subject.txt \
              --body-from-file reports/client-email-body.html \
              || echo "Client send failed (best-effort — the staff email already shipped; see log above)"
          else
            echo "SAMPLE send — client_report disabled or send_to=test → $SAMPLE_TO only. Lonny receives NOTHING."
            # Label the sample UNMISTAKABLY (2026-07-11, Michael mistook the
            # sample for a gutted daily tracker). Also load-bearing: an
            # unprefixed sample shares the real client subject, so a sample
            # sent earlier the same day would trip the mailbox guard and
            # BLOCK the real client send once the gate is enabled.
            printf '[SAMPLE - internal preview, Lonny does NOT receive this] %s' \
              "$(cat reports/client-email-subject.txt)" > reports/client-email-subject-sample.txt
            python3 scripts/outlook_send.py daily --to $SAMPLE_TO \
              --verification \
              --subject-from-file reports/client-email-subject-sample.txt \
              --body-from-file reports/client-email-body.html \
              || echo "Client SAMPLE send failed (best-effort — never fails the job)"
          fi
          exit 0

      - name: Prove the fire shipped (integrity gate)
        # Flip from "assume success by reaching the last line" to "prove the
        # deliverable shipped or scream" — mirroring the Cloud PC wrapper's
        # final step. assert_fire_integrity asserts the pipeline exited 0,
        # today's client artifacts are fresh, and (for a full send) today's
        # sent-flag exists — the proof outlook_send writes only AFTER a real
        # delivery. A short-circuited send (stale flag, mailbox-guard
        # false-positive) leaves no fresh flag, so this fails and the
        # heartbeat below reports status=failed instead of a false green.
        # On any violation it also raises the out-of-band alarm (GitHub issue
        # + Teams), never the Outlook path it's alarming about. Verification
        # (send_to=test) runs use --no-flag, so assert with --no-require-send.
        id: integrity
        if: always() && steps.pipeline.conclusion != 'skipped'
        run: |
          # SECOND LOCK on the client distribution. The gate refuses an
          # explicit send_to=full under verify_only, but a SCHEDULED fire
          # never passes send_to at all and the expression above resolves it
          # to "full". Michael 2026-08-13 wants the schedule to run and scan
          # mail while every send goes to him alone, so verify_only rewrites
          # SEND_TO here, where the flag is a real shell variable.
          if [ "$HILMAR_REPORTS_PAUSED" = "verify_only" ]; then
            SEND_TO=test
            echo "verify_only — SEND_TO forced to 'test' (Michael only)."
          fi
          if [ "$SEND_TO" = "full" ]; then
            python3 deploy/assert_fire_integrity.py --pipeline-rc "${{ steps.pipeline.outputs.rc }}"
          else
            python3 deploy/assert_fire_integrity.py --pipeline-rc "${{ steps.pipeline.outputs.rc }}" --no-require-send
          fi

      - name: Push pipeline state back to blob store
        id: push
        # ALWAYS — even on a failed fire we persist whatever state advanced,
        # so the next run doesn't re-ingest from a stale snapshot.
        #
        # STAYS FATAL, deliberately. It runs AFTER both sends, so it cannot
        # block the report, and a red job here is the correct signal: the
        # sent-flags did not persist. That is a real double-send hazard, and
        # it should not be dressed up as success.
        if: always()
        run: python3 scripts/state_store.py push

      - name: Warn that state did not persist
        if: always() && steps.push.outcome == 'failure'
        # A failed push means today's sent-flags are not in the blob store, so
        # a second dispatch on a fresh runner will not see them. The durable
        # guard is outlook_send's mailbox check, not these flags — but nobody
        # should be re-dispatching on that assumption without being told.
        continue-on-error: true
        run: |
          python3 scripts/fire_alert.py \
            --level error \
            --title "State push FAILED — today's sent-flags did not persist" \
            --body "Run ${{ github.run_id }}: the report may have shipped, but state did not. A second dispatch on a fresh runner will not see today's flag. Do NOT re-dispatch until the blob store accepts writes again — see scripts/diag_blob.py." \
            || true

      - name: Emit liveness heartbeat
        # liveness.yml alerts when no successful heartbeat.yml run landed in
        # 25h. The Cloud PC wrapper emits one after its fire; the GH fire
        # must do the same or liveness false-alarms the day after cutover.
        # Verification sends deliberately do NOT emit — a test fire must
        # never mask a missed production fire. The status reflects the
        # integrity gate, NOT mere step completion: if the fire did not prove
        # it shipped (integrity != success), we emit status=failed so
        # heartbeat.yml fails the run and liveness's failed-branch fires —
        # rather than a silent green that hides a missed delivery.
        if: always() && env.SEND_TO == 'full' && steps.integrity.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run heartbeat.yml --ref main -R "${{ github.repository }}" \
            -f at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f sha="${{ github.sha }}" \
            -f status=${{ steps.integrity.outcome == 'success' && 'success' || 'failed' }} \
            -f host=github-actions

      - name: Upload run artifacts
        # SECURITY: do NOT upload the rendered client email body or the audit
        # report as plaintext artifacts. reports/email-body.html and
        # reports/improvements-report.html embed exactly the client PII the
        # pipeline scrubs on every other egress (client name, lanes, carriers,
        # OL rates, the distribution list, MDOLX booking refs) — the Sentry
        # path strips these via _before_send, but an artifact upload has no
        # redaction and is downloadable by anyone with repo read access for
        # the retention window. Upload only the non-PII debug artifacts
        # (qc-result / test-result / coverage), which are sufficient
        # to verify what the run did without leaking the client report.
        #
        # reports/run-log.txt was REMOVED from this list on 2026-09-04, the
        # same change that started writing it. run_pipeline now tees the whole
        # fire transcript there so QC-021 and QC-055 can read it on this host,
        # and that transcript is not the terse step echoes this list was
        # written for: fire 33864188808's pipeline output carries 29 distinct
        # email addresses (Lonny's included), 95 MDOLX refs, OL rates and
        # lanes. sentry_setup._scrub_string redacts addresses and refs but NOT
        # lanes or rates, so scrubbing would not satisfy the rule above. The
        # transcript stays ON the runner, where the QC checks read it; the
        # per-step detail it carries is already in the job log, which is the
        # channel this fire's evidence has always used and whose exposure is
        # unchanged. Uploading a scrubbed transcript is available if Michael
        # wants it — that is a data-handling call, not an engineering one.
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: production-fire-${{ github.run_id }}
          path: |
            reports/qc-result.json
            reports/test-result.json
            reports/coverage.json
          retention-days: 14
          if-no-files-found: warn
