name: Daily

# Two jobs (plus a schedule gate):
#   - `audit` (scheduled + manual): runs the test+coverage routine, captures
#     artifacts, reports green/red. Always on.
#   - `production-fire`: the REAL daily fire, fully wired — pulls state from
#     blob, runs the 16-step pipeline with app-only Graph auth, sends to the
#     full distribution as the shared mailbox, pushes state back, emits the
#     liveness heartbeat. Moving the fire here kills the git-pull + xcopy
#     silent-failure chain that the Cloud PC depends on.
#
# How production-fire triggers:
#   - Manual dispatch with mode=production-fire. `send_to` defaults to `test`
#     (Michael only) so a verification dispatch can NEVER hit the 10-recipient
#     distribution by accident — pick send_to=full deliberately.
#   - On schedule, ONLY when the repo variable HILMAR_FIRE_FROM_ACTIONS is
#     set to 'true' (Settings → Secrets and variables → Actions → Variables).
#     That variable IS the cutover switch: setting it moves the daily fire
#     here; unsetting it rolls back to the Cloud PC. No YAML edit needed.
#
# Graph auth (2026-06-10): OL IT declined to register an app-only Entra
# app, so the default auth is DELEGATED — the same device-code token the
# Cloud PC uses, synced through the blob store (state_store pulls it before
# the fire, pushes the refreshed cache after; daily refresh keeps the
# ~90-day refresh token alive indefinitely). The GRAPH_APP_* secrets remain
# supported and take precedence if OL ever registers the app.
#
# To cut over from the Cloud PC to GH Actions:
#   1. Secrets needed: SENTRY_DSN, SENTRY_AUTH_TOKEN, ANTHROPIC_API_KEY,
#      QT_APP_PASSWORD, AZURE_STORAGE_CONNECTION_STRING.
#   2. Seed state ONCE from the Cloud PC (uploads tracking data, stage
#      cache, and the token cache to the blob store):
#        $env:AZURE_STORAGE_CONNECTION_STRING = "<the same value as the secret>"
#        python scripts\state_store.py push
#   3. Dispatch once with mode=production-fire, send_to=test — a full real
#      fire that emails ONLY michael.deitchman@idealx.us for verification.
#      The validator's silent-refresh check is also the Conditional Access
#      verdict: if OL blocks token refresh from GitHub IPs, it fails THERE
#      with a plain-English message, and off-Cloud-PC firing needs OL.
#   4. When clean: disable the Cloud PC's "Hilmar Daily Tracker - CloudPC"
#      scheduled task FIRST, then set HILMAR_FIRE_FROM_ACTIONS=true. Order
#      matters — sent-flags are per-machine, so two live schedules would
#      BOTH send to the client (see docs/MOVE-OFF-CLOUDPC.md).

on:
  # ONCE A DAY, right at report time (~6 PM ET). ONE GitHub cron per DST
  # season is the RELIABLE trigger — it's runner-backed and doesn't depend on
  # the Cloud PC. (Removing the schedule entirely on 2026-06-19 silently killed
  # the daily fire for 4 weekdays: the Cloud PC dispatch + liveness were NOT
  # actually firing, and the schedule was the only working trigger. Lesson:
  # "once a day" needs one reliable trigger, not zero.) GitHub cron can land
  # 2-4h late, which is fine for an EVENING fire (Lonny's PT day is already
  # complete). liveness.yml remains the backstop; the Cloud PC trigger, if it
  # ever fires, is de-duped by the same-day sent-flag (no double client email).
  # The gate accepts the tick whose HOUR matches 6 PM ET for the current DST
  # offset (22 UTC in EDT, 23 in EST) and skips the other, so DST never doubles.
  schedule:
    - cron: "7 22 * * 1-5"    # ~6:07 PM EDT
    - cron: "7 23 * * 1-5"    # ~6:07 PM EST (gated out in EDT)
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "audit-only"
        type: choice
        options:
          - audit-only        # Tests + coverage + dry-run (today's default)
          - production-fire   # The real daily fire
      send_to:
        description: "production-fire recipients (test = Michael only)"
        required: false
        default: "test"
        type: choice
        options:
          - test              # michael.deitchman@idealx.us only — safe default
          - full              # the 10-recipient client distribution
      force_resend:
        description: "Override today's already-sent flag (re-send even if the daily email already went out). Manual dispatch ONLY — scheduled fires never force."
        required: false
        default: false
        type: boolean

# Serialize Daily runs so the multiple morning ticks (and any manual
# dispatch) can't run concurrently and race the blob state push/pull.
# cancel-in-progress:false — NEVER cancel a fire mid-send; queue instead.
# The first run sends; queued ones reach the mailbox guard and no-op.
concurrency:
  group: hilmar-daily-fire
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  HILMAR_PARSER_FALLBACK_DISABLE: "1"

jobs:
  gate:
    name: 6 PM ET schedule gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - id: decide
        # A tick proceeds iff its HOUR field is the UTC hour of 6 PM ET for
        # the current DST offset (22 in EDT, 23 in EST) — minute-agnostic, so
        # the several evening ticks all proceed in-season and the off-season
        # set is skipped. Keying on offset (not wall-clock now) means GitHub's
        # multi-hour cron lateness can never skip a day or run the wrong set.
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual dispatch — gate open."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          offset=$(TZ=America/New_York date +%z)   # -0400 in EDT, -0500 in EST
          cron="${{ github.event.schedule }}"
          cron_hour=$(echo "$cron" | awk '{print $2}')   # field 2 of "M H * * 1-5"
          proceed=false
          if [ "$offset" = "-0400" ] && [ "$cron_hour" = "22" ]; then proceed=true; fi
          if [ "$offset" = "-0500" ] && [ "$cron_hour" = "23" ]; then proceed=true; fi
          echo "cron='$cron' hour=$cron_hour ET-offset=$offset → proceed=$proceed"
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  audit:
    name: Daily test + coverage audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    # Only for an explicit audit-only dispatch. A production fire does NOT run
    # this — the pipeline already runs the same test+coverage routine internally
    # (QC-052 via run_audit_tests), so a separate audit job here just doubled
    # the test-suite compute on every fire (2026-06-19 trim).
    if: needs.gate.outputs.proceed == 'true' && github.event.inputs.mode == 'audit-only'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            reportlab msal requests tzdata pdfplumber \
            sentry-sdk jsonschema python-dateutil jinja2 anthropic \
            pytest pytest-cov responses

      - name: Run the test + coverage routine
        # Same script the Cloud PC runs as the first pipeline step (QC-052).
        # Writes reports/test-result.json with status, gate, per-module
        # coverage, untested modules.
        run: python3 scripts/run_audit_tests.py

      - name: Upload artifacts
        # The audit artifacts are how Michael verifies "what did the daily
        # run actually see". On the Cloud PC they live in OneDrive; on GH
        # Actions they need explicit upload to be reviewable.
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: daily-audit-${{ github.run_id }}
          path: |
            reports/test-result.json
            reports/coverage.json
            reports/qc-result.json
          retention-days: 14
          if-no-files-found: warn

      - name: Surface failure to the GH check
        if: failure()
        run: |
          echo "::error::Daily audit run failed — see test-result.json artifact"
          if [ -f reports/test-result.json ]; then
            python3 -c "import json; d=json.load(open('reports/test-result.json')); print(f\"status={d.get('status')} tests_ok={d.get('tests_ok')} coverage={d.get('total_coverage')}%\")"
          fi

  production-fire:
    name: Production fire
    # The daily fire. Runs on the ~6 PM ET schedule (the reliable trigger), on a
    # manual dispatch with mode=production-fire, and on liveness.yml's
    # auto-recovery dispatch. A scheduled run always sends to the full list
    # (SEND_TO below); the same-day sent-flag makes any overlap idempotent.
    if: >-
      needs.gate.outputs.proceed == 'true' &&
      (github.event_name == 'schedule' ||
       github.event.inputs.mode == 'production-fire')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Depends on `gate` only — NOT the audit job (which is skipped for a fire),
    # so production-fire runs without a duplicate test-suite job.
    needs: [gate]
    permissions:
      contents: read
      actions: write     # to dispatch heartbeat.yml at end of a full fire
    # All Graph + service secrets are exposed to every step that needs them.
    # App-only Graph (GRAPH_APP_*) is consumed by GraphClient.authenticate()
    # and outlook_send._app_only_send_context(); state sync uses the blob
    # connection string. The pipeline reads the rest from env via the same
    # paths the Cloud PC reads secrets/*.txt.
    env:
      GRAPH_APP_TENANT_ID: ${{ secrets.GRAPH_APP_TENANT_ID }}
      GRAPH_APP_CLIENT_ID: ${{ secrets.GRAPH_APP_CLIENT_ID }}
      GRAPH_APP_CLIENT_SECRET: ${{ secrets.GRAPH_APP_CLIENT_SECRET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      QT_APP_PASSWORD: ${{ secrets.QT_APP_PASSWORD }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      # Scheduled fires are always the real thing; dispatches honor send_to
      # (default test — Michael only).
      SEND_TO: ${{ github.event_name == 'schedule' && 'full' || github.event.inputs.send_to }}
      # Operator override for the per-day idempotency flag. ONLY a manual
      # dispatch can set it (scheduled fires can't pass inputs, so this is
      # always empty on a schedule → a scheduled fire NEVER force-sends and
      # can never double-send the client list). Use when a stale/earlier flag
      # is wrongly suppressing today's real send (e.g. the 2026-06-16 mid-day
      # cutover hangover).
      FORCE_RESEND: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_resend || 'false' }}
      # Never let a failed silent refresh fall into the interactive
      # device-code prompt — on a headless runner that blocks until the
      # job times out. Fail loudly instead.
      HILMAR_NONINTERACTIVE: "1"
      # The ~6 PM ET evening fire reports on TODAY's now-complete Pacific
      # business day (set explicitly; "current" is also core.py's default).
      HILMAR_REPORT_WINDOW: "current"
      # Skip the in-pipeline pytest+coverage routine: the dedicated test.yml CI
      # workflow already runs the full suite on every push/PR (the authoritative
      # gate), so re-running it under coverage here is redundant — and on a
      # runner it times out even at 600s, wasting ~10min and spamming Sentry
      # (it's best-effort so it never blocked the fire, but it's pure noise).
      HILMAR_SKIP_PIPELINE_TESTS: "1"
    steps:
      - name: Verify prerequisites — refuse to fire if anything's missing
        # The pipeline silently degrades on missing secrets, so we hard-fail
        # here BEFORE the fire to make a misconfiguration loud. GRAPH_APP_*
        # is deliberately NOT required: OL declined to register the app-only
        # Entra app (2026-06-10), so the default auth is the delegated token
        # cache pulled from the blob store — validated for real below.
        run: |
          missing=0
          for v in SENTRY_DSN ANTHROPIC_API_KEY AZURE_STORAGE_CONNECTION_STRING; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not set — production-fire blocked"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::Refusing to fire — set the secrets in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "All required secrets present. SEND_TO=$SEND_TO"

      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            reportlab msal requests tzdata pdfplumber \
            sentry-sdk jsonschema python-dateutil jinja2 anthropic \
            azure-storage-blob pytest pytest-cov responses

      - name: Materialize secret files the pipeline reads from secrets/*.txt
        # Several modules read secrets/<name>.txt directly (sentry_setup,
        # model_router, sync_to_quote_tracker). Write them from env so the
        # GH Actions run matches the Cloud PC's on-disk layout. The dir is
        # gitignored; these files live only for this job's lifetime.
        run: |
          mkdir -p secrets
          printf '%s' "$SENTRY_DSN"        > secrets/sentry-dsn.txt
          printf '%s' "$SENTRY_AUTH_TOKEN" > secrets/sentry-auth-token.txt
          printf '%s' "$ANTHROPIC_API_KEY" > secrets/anthropic-api-key.txt
          printf '%s' "$QT_APP_PASSWORD"   > secrets/quote-tracker-pwd.txt

      - name: Pull pipeline state from blob store
        # tracking-data-v2.json + staged email cache + the delegated token
        # cache + today's sent-flags from the prior fire. The flags make
        # idempotency machine-independent: a second dispatch today sees the
        # flag and refuses to double-send. Pulled BEFORE validation so the
        # validator can test the token cache it just received.
        run: python3 scripts/state_store.py pull

      - name: Snapshot backup to blob store
        # Dated gzip of the just-pulled state — i.e. yesterday's end-state,
        # before today's fire mutates it. QC-032's durable target on this
        # host (the OneDrive/local backup dirs only exist on the Cloud PC).
        run: python3 scripts/state_store.py backup

      - name: Validate prerequisites for real — name any wrong secret
        # The non-empty loop above can't catch a wrong-field paste (storage
        # Key instead of Connection string, a non-GUID tenant id) — those
        # died mid-run as SDK tracebacks on 2026-06-10. This does one cheap
        # real check per item and says exactly what to fix, including a live
        # silent-refresh of the delegated token (which is also the
        # Conditional Access verdict for firing from GitHub's IPs). Read-only.
        run: python3 scripts/verify_fire_prereqs.py

      - name: Run the daily pipeline (app-only Graph auth)
        # refresh_stage reads the OL/Lonny thread via app-only Graph; the
        # 16-step pipeline ingests → QC → renders. GRAPH_APP_* in env routes
        # GraphClient to the app-only path automatically. Capture the
        # pipeline's true exit code so the integrity gate below can assert on
        # it (rather than assuming success by reaching the last line).
        id: pipeline
        run: |
          python3 scripts/refresh_stage.py --days-back 14
          rc=0
          python3 scripts/run_pipeline.py || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error::run_pipeline.py exited rc=$rc"
            exit "$rc"
          fi

      - name: Send the daily email + audit
        # outlook_send picks /users/{SEND_MAILBOX}/sendMail because GRAPH_APP_*
        # is set. Full sends are idempotent via reports/sent-YYYY-MM-DD.flag
        # (synced through the blob store). Verification sends go to Michael
        # only and use --no-flag so they never touch production idempotency
        # state — a test must never block or unblock the real send.
        run: |
          if [ "$SEND_TO" = "full" ]; then
            # FORCE_RESEND=true (manual dispatch only) overrides the per-day
            # already-sent flag. We use --force (NOT --no-flag) so the send is
            # still recorded — a later un-forced run won't re-send again. This
            # is the recovery lever for a stale/earlier flag wrongly suppressing
            # today's real send.
            FORCE_FLAG=""
            if [ "$FORCE_RESEND" = "true" ]; then
              FORCE_FLAG="--force"
              echo "⚠️  FORCE_RESEND=true — overriding today's already-sent idempotency flag"
            fi
            echo "FULL distribution send (config.json distribution.full_list)"
            python3 scripts/outlook_send.py daily --to-from-config $FORCE_FLAG \
              --subject-from-file reports/email-subject.txt \
              --body-from-file reports/email-body.html \
              --attach reports/hilmar-dashboard.html reports/hilmar-report.pdf
            python3 scripts/gen_improvements_report.py
            python3 scripts/outlook_send.py daily --to michael.deitchman@idealx.us $FORCE_FLAG \
              --subject-from-file reports/improvements-subject.txt \
              --body-from-file reports/improvements-report.html
          else
            echo "VERIFICATION send — michael.deitchman@idealx.us only (send_to=test)"
            python3 scripts/outlook_send.py daily --to michael.deitchman@idealx.us \
              --force --no-flag \
              --subject-from-file reports/email-subject.txt \
              --body-from-file reports/email-body.html \
              --attach reports/hilmar-dashboard.html reports/hilmar-report.pdf
            python3 scripts/gen_improvements_report.py
            python3 scripts/outlook_send.py daily --to michael.deitchman@idealx.us \
              --force --no-flag \
              --subject-from-file reports/improvements-subject.txt \
              --body-from-file reports/improvements-report.html
          fi

      - name: Send the client-facing email (gated)
        # The CLIENT-facing daily service update (gen_client_email.py →
        # reports/client-email-*.{html,txt}). SHIPS GATED OFF: only when
        # config.json client_report.enabled=true AND this is a full production
        # send does it go to the client recipients (with --flag-name
        # client-sent, its own idempotency namespace, synced via state_store).
        # Otherwise a SAMPLE goes to sample_to (Michael only) with
        # --force --no-flag so it never touches idempotency state. QC-065 pins
        # the approved to/cc and scans the body for internal-analytics leaks.
        # BEST-EFFORT: this step must never fail the job — the staff email has
        # already shipped by this point; every branch exits 0.
        run: |
          set +e
          ENABLED=$(python3 -c "import json; print(str(json.load(open('config.json')).get('client_report', {}).get('enabled', False)).lower())" 2>/dev/null || echo "false")
          CLIENT_TO=$(python3 -c "import json; print(' '.join(json.load(open('config.json')).get('client_report', {}).get('to', [])))" 2>/dev/null || echo "")
          CLIENT_CC=$(python3 -c "import json; print(' '.join(json.load(open('config.json')).get('client_report', {}).get('cc', [])))" 2>/dev/null || echo "")
          SAMPLE_TO=$(python3 -c "import json; print(' '.join(json.load(open('config.json')).get('client_report', {}).get('sample_to', ['michael.deitchman@idealx.us'])))" 2>/dev/null || echo "michael.deitchman@idealx.us")
          if [ ! -f reports/client-email-body.html ] || [ ! -f reports/client-email-subject.txt ]; then
            echo "Client-facing email artifacts missing (best-effort build step failed?) — skipping."
            exit 0
          fi
          if [ "$ENABLED" = "true" ] && [ "$SEND_TO" = "full" ] && [ -n "$CLIENT_TO" ]; then
            echo "CLIENT send — client_report.enabled=true and send_to=full → TO=$CLIENT_TO CC=$CLIENT_CC"
            python3 scripts/outlook_send.py daily --to $CLIENT_TO --cc $CLIENT_CC \
              --flag-name client-sent \
              --subject-from-file reports/client-email-subject.txt \
              --body-from-file reports/client-email-body.html \
              || echo "Client send failed (best-effort — the staff email already shipped; see log above)"
          else
            echo "SAMPLE send — client_report disabled or send_to=test → $SAMPLE_TO only. Lonny receives NOTHING."
            python3 scripts/outlook_send.py daily --to $SAMPLE_TO \
              --force --no-flag \
              --subject-from-file reports/client-email-subject.txt \
              --body-from-file reports/client-email-body.html \
              || echo "Client SAMPLE send failed (best-effort — never fails the job)"
          fi
          exit 0

      - name: Prove the fire shipped (integrity gate)
        # Flip from "assume success by reaching the last line" to "prove the
        # deliverable shipped or scream" — mirroring the Cloud PC wrapper's
        # final step. assert_fire_integrity asserts the pipeline exited 0,
        # today's client artifacts are fresh, and (for a full send) today's
        # sent-flag exists — the proof outlook_send writes only AFTER a real
        # delivery. A short-circuited send (stale flag, mailbox-guard
        # false-positive) leaves no fresh flag, so this fails and the
        # heartbeat below reports status=failed instead of a false green.
        # On any violation it also raises the out-of-band alarm (GitHub issue
        # + Teams), never the Outlook path it's alarming about. Verification
        # (send_to=test) runs use --no-flag, so assert with --no-require-send.
        id: integrity
        if: always() && steps.pipeline.conclusion != 'skipped'
        run: |
          if [ "$SEND_TO" = "full" ]; then
            python3 deploy/assert_fire_integrity.py --pipeline-rc "${{ steps.pipeline.outputs.rc }}"
          else
            python3 deploy/assert_fire_integrity.py --pipeline-rc "${{ steps.pipeline.outputs.rc }}" --no-require-send
          fi

      - name: Push pipeline state back to blob store
        # ALWAYS — even on a failed fire we persist whatever state advanced,
        # so the next run doesn't re-ingest from a stale snapshot.
        if: always()
        run: python3 scripts/state_store.py push

      - name: Emit liveness heartbeat
        # liveness.yml alerts when no successful heartbeat.yml run landed in
        # 25h. The Cloud PC wrapper emits one after its fire; the GH fire
        # must do the same or liveness false-alarms the day after cutover.
        # Verification sends deliberately do NOT emit — a test fire must
        # never mask a missed production fire. The status reflects the
        # integrity gate, NOT mere step completion: if the fire did not prove
        # it shipped (integrity != success), we emit status=failed so
        # heartbeat.yml fails the run and liveness's failed-branch fires —
        # rather than a silent green that hides a missed delivery.
        if: always() && env.SEND_TO == 'full' && steps.integrity.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run heartbeat.yml --ref main -R "${{ github.repository }}" \
            -f at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f sha="${{ github.sha }}" \
            -f status=${{ steps.integrity.outcome == 'success' && 'success' || 'failed' }} \
            -f host=github-actions

      - name: Upload run artifacts
        # SECURITY: do NOT upload the rendered client email body or the audit
        # report as plaintext artifacts. reports/email-body.html and
        # reports/improvements-report.html embed exactly the client PII the
        # pipeline scrubs on every other egress (client name, lanes, carriers,
        # OL rates, the distribution list, MDOLX booking refs) — the Sentry
        # path strips these via _before_send, but an artifact upload has no
        # redaction and is downloadable by anyone with repo read access for
        # the retention window. Upload only the non-PII debug artifacts
        # (run-log / qc-result / test-result / coverage), which are sufficient
        # to verify what the run did without leaking the client report.
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: production-fire-${{ github.run_id }}
          path: |
            reports/run-log.txt
            reports/qc-result.json
            reports/test-result.json
            reports/coverage.json
          retention-days: 14
          if-no-files-found: warn
