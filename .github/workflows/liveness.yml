name: Liveness monitor

# Catches the failure mode where the Cloud PC was asleep / network down /
# Windows update reboot / Sentry asleep at 10 AM ET and NO pipeline fired
# at all. Today's daily audit only reports IF the pipeline ran — silent
# absence is invisible.
#
# This workflow runs on GitHub-hosted Ubuntu (always available, free,
# independent of the Cloud PC). Fires at 11:30 AM ET — 1.5h after the
# Cloud PC fire is supposed to land — and posts a GitHub issue if no
# successful heartbeat arrived.
#
# Heartbeat mechanism (2026-06-01 redesign):
#   Whoever performed the daily fire dispatches `heartbeat.yml` at the end
#   of a successful run — the Cloud PC's wrapper
#   (`deploy/run_daily_laptop.cmd`, host=cloud-pc) or the GH Actions
#   production-fire job in daily.yml (host=github-actions). This workflow
#   then reads
#     gh run list --workflow=heartbeat.yml --branch=main --status=success
#   and checks the most-recent run's age. Source-agnostic on purpose: the
#   cutover (HILMAR_FIRE_FROM_ACTIONS) moves the fire without touching
#   liveness.
#
# Failure escalates to a GitHub issue tagged `cloud-pc-down` (label kept
# for history continuity — read it as "daily fire missed"). Issue is
# auto-closed when the next successful heartbeat lands.

on:
  schedule:
    # The backstop must not share the daily fire's single-point-of-failure:
    # on 2026-06-15 this monitor's lone 15:30 tick was itself hours late on
    # GitHub's scheduler, so the auto-recovery never ran. Fire SEVERAL ticks
    # across late-morning/midday ET — each one re-checks "did a fire happen
    # today?" and dispatches production-fire if not. Re-runs are safe: the
    # check is idempotent (skips once a heartbeat exists) and the fire's
    # mailbox guard blocks any duplicate send. ~15:30 UTC = 11:30 ET (EDT).
    - cron: "30 15 * * 1-5"   # ~11:30 ET (EDT) / 10:30 ET (EST)
    - cron: "15 16 * * 1-5"   # ~12:15 ET (EDT)
    - cron: "0 17 * * 1-5"    # ~1:00 PM ET (EDT)
    - cron: "0 18 * * 1-5"    # ~2:00 PM ET (EDT) — catches the 4h-late case
  workflow_dispatch:

# Serialize so overlapping late ticks don't both dispatch; the heartbeat
# check is idempotent anyway, this just avoids redundant runs.
concurrency:
  group: hilmar-liveness
  cancel-in-progress: false

jobs:
  check-heartbeat:
    name: Verify the daily fire happened today
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write      # to file the alert issue if check fails
      contents: read
      actions: write     # to auto-dispatch the fire when today's is missing

    steps:
      - uses: actions/checkout@v5
        with:
          # We need the most recent successful artifact, not the latest
          # commit — but checkout's enough to read scripts that might
          # parse heartbeat formats in the future.
          fetch-depth: 1

      - name: Ensure cloud-pc-down label exists
        # Pre-2026-06-01 this workflow assumed the label was present and
        # `gh issue create --label cloud-pc-down` would just work. On
        # first run after merge the label didn't exist yet and the
        # workflow failed with a label-not-found error (today's
        # noticed-via-email failure). Idempotent: succeeds if label
        # exists; creates it if not.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh label list --search cloud-pc-down --json name -q '.[].name' \
                | grep -Fxq cloud-pc-down; then
            gh label create cloud-pc-down \
              --color B60205 \
              --description "Liveness monitor: Cloud PC missed a scheduled fire"
          fi

      - name: Find latest heartbeat + check freshness
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Heartbeat = successful run of heartbeat.yml triggered by the
          # Cloud PC's wrapper at end of fire (2026-06-01 redesign).
          latest=$(gh run list --workflow=heartbeat.yml --branch=main \
                              --status=success \
                              --limit=1 --json status,conclusion,createdAt,databaseId \
                              -q '.[0]')
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "no_fire=true" >> "$GITHUB_OUTPUT"
            echo "reason=No heartbeat.yml run has ever happened on main — Cloud PC wrapper may not be wired to dispatch heartbeats yet, see docs/CLOUD-PC-HEARTBEAT-SETUP.md" >> "$GITHUB_OUTPUT"
            echo "run_id=" >> "$GITHUB_OUTPUT"
            echo "conclusion=" >> "$GITHUB_OUTPUT"
            echo "created=" >> "$GITHUB_OUTPUT"
            echo "age_h=" >> "$GITHUB_OUTPUT"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_id=$(echo "$latest" | jq -r .databaseId)
          conclusion=$(echo "$latest" | jq -r .conclusion)
          created=$(echo "$latest" | jq -r .createdAt)
          # Age in hours since the run started. >25h means we missed today's
          # 10 AM window (and likely yesterday's too).
          age_h=$(python3 -c "
          from datetime import datetime, timezone
          import sys
          ts = datetime.fromisoformat('$created'.replace('Z', '+00:00'))
          print(f'{(datetime.now(timezone.utc) - ts).total_seconds() / 3600:.1f}')
          ")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"
          echo "age_h=$age_h" >> "$GITHUB_OUTPUT"
          # Decide pass/fail
          stale="false"
          if [ "$(python3 -c "print(float('$age_h') > 25)")" = "True" ]; then
            stale="true"
          fi
          failed="false"
          if [ "$conclusion" != "success" ] && [ "$conclusion" != "null" ]; then
            failed="true"
          fi
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          if [ "$stale" = "true" ] || [ "$failed" = "true" ]; then
            echo "no_fire=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_fire=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-recover — dispatch today's fire if it never happened
        # GitHub's cron is unreliable for this repo (observed 30min-4.5h
        # late; on 2026-06-12 the 10:07 ET tick simply hadn't arrived by
        # 10:41). The staleness check above only catches a miss the NEXT
        # day (25h threshold), so this step closes the same-day gap: if no
        # heartbeat has landed TODAY (ET) by the time liveness runs
        # (11:30 ET), dispatch the real fire ourselves. Racing the late
        # cron is safe — outlook_send's mailbox guard refuses a second
        # full-distribution send no matter which machine got there first.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created="${{ steps.check.outputs.created }}"
          today_et=$(TZ=America/New_York date +%F)
          dow=$(TZ=America/New_York date +%u)
          hour_et=$(TZ=America/New_York date +%-H)
          if [ "$dow" -ge 6 ]; then
            echo "Weekend — no fire expected."; exit 0
          fi
          if [ -n "$created" ] && [ "$(TZ=America/New_York date -d "$created" +%F)" = "$today_et" ]; then
            echo "Today's heartbeat present ($created) — no recovery needed."; exit 0
          fi
          if [ "$hour_et" -lt 11 ]; then
            echo "Before 11:00 ET — leaving room for the scheduled fire."; exit 0
          fi
          echo "::warning::No heartbeat today ($today_et) — auto-dispatching production-fire (send_to=full). Mailbox guard prevents any double-send."
          gh workflow run daily.yml --ref main -R "${{ github.repository }}" \
            -f mode=production-fire -f send_to=full

      - name: All good
        if: steps.check.outputs.no_fire != 'true'
        run: |
          echo "✅ Heartbeat run #${{ steps.check.outputs.run_id }} (${{ steps.check.outputs.conclusion }}) at ${{ steps.check.outputs.created }} — ${{ steps.check.outputs.age_h }}h ago"

      - name: File alert issue (Cloud PC missed its fire)
        if: steps.check.outputs.no_fire == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # De-dupe: if there's already an open `cloud-pc-down` issue
          # from today, comment on it rather than spamming a new one.
          today=$(date -u +%Y-%m-%d)
          existing=$(gh issue list --label cloud-pc-down --state open \
                                   --search "created:>=$today" \
                                   --json number,title -q '.[0].number' 2>/dev/null || true)
          body="**Liveness check failed** at $(date -u +'%Y-%m-%dT%H:%M:%SZ').

          - Latest heartbeat run: \`${{ steps.check.outputs.run_id }}\`
          - Conclusion: \`${{ steps.check.outputs.conclusion }}\`
          - Started at: \`${{ steps.check.outputs.created }}\`
          - Age: \`${{ steps.check.outputs.age_h }}h\` (threshold: 25h)
          - Stale: \`${{ steps.check.outputs.stale }}\`
          - Failed: \`${{ steps.check.outputs.failed }}\`

          ## Likely causes
          If the fire runs from GH Actions (HILMAR_FIRE_FROM_ACTIONS=true):
          - The Daily workflow's production-fire job failed — check the
            Actions tab for today's run + its artifacts
          - The job succeeded but its heartbeat dispatch step failed
          If the fire runs from the Cloud PC:
          - Cloud PC asleep / network down at 10 AM ET
          - Cloud PC wrapper completed fire but heartbeat dispatch failed
            (gh CLI auth, PAT expired, network glitch)
          - Windows Task Scheduler missed the 10 AM trigger
          - Windows Update reboot consumed the fire window
          - Wrapper not yet wired to dispatch heartbeats (see
            docs/CLOUD-PC-HEARTBEAT-SETUP.md)

          ## Recovery
          - GH Actions fire: re-dispatch Actions → Daily → Run workflow →
            mode=production-fire, send_to=full (idempotency flags prevent a
            double-send if the email actually went out)
          - Cloud PC fire: log in and run \`deploy\\\\run_daily_laptop.cmd\` manually
          - Or manually trigger \`heartbeat.yml\` via Actions UI → Run workflow
            to clear today's alert (only do this if you've verified the
            fire actually completed)
          - Or wait for tomorrow's 10 AM ET fire if today's audit isn't critical

          This issue will auto-close when the next successful heartbeat lands.
          "
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body "$body"
            echo "Updated existing issue #$existing"
          else
            gh issue create \
              --title "Liveness check failed — Cloud PC may have missed daily fire" \
              --label cloud-pc-down \
              --body "$body"
          fi

      - name: Auto-close stale alert issues (next successful fire)
        if: steps.check.outputs.no_fire != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Close any open `cloud-pc-down` issues — the fire recovered.
          for n in $(gh issue list --label cloud-pc-down --state open --json number -q '.[].number'); do
            gh issue comment "$n" --body "Recovered: heartbeat run #${{ steps.check.outputs.run_id }} succeeded at ${{ steps.check.outputs.created }}. Auto-closing."
            gh issue close "$n"
          done
