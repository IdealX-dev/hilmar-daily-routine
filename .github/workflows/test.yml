name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab msal requests tzdata pdfplumber

      - name: Lint syntax (compile every module)
        run: |
          python -m compileall -q scripts/ deploy/ || true
          # Re-run with strict to surface any actual SyntaxError
          python -m compileall scripts/ deploy/

      - name: Module import smoke test
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          set -e
          failed=0
          for mod in body_parser core ingest patch_carriers gen_email gen_dashboard gen_pdf gen_carrier_scorecard_pdf gen_email_new gen_improvements_report gen_rate_intelligence gen_weekly_summary share_intel teams_alert pdf_parser auto_chase_pending refresh_stage outlook_send fetch_bodies qc_selfheal drift_check backup; do
            if [ -f "scripts/$mod.py" ]; then
              if python -c "import sys; sys.path.insert(0, 'scripts'); import $mod" 2>&1; then
                echo "  OK  $mod"
              else
                echo "  FAIL $mod"
                failed=$((failed+1))
              fi
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed module(s) failed to import"
            exit 1
          fi

      - name: Unit tests (skip if fixtures missing)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          if [ -f scripts/run_tests.py ] && [ -d tests/fixtures ]; then
            python scripts/run_tests.py || {
              echo "::warning::run_tests.py exited non-zero — review log above"
              exit 0
            }
          else
            echo "No tests/fixtures present — skipping unit tests"
          fi
