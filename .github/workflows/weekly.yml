name: Weekly exec summary

# Michael 2026-07-16: "exec summary monday 5am by time and mark for previous
# week." A standalone Monday ~5:07 AM ET fire that builds the executive summary
# for the PREVIOUS (just-completed) Mon-Fri week and emails it to the INTERNAL
# staff distribution (config.json distribution.full_list). It is internal
# analytics (win rates, carrier scoreboard, Q&L negotiation candidates) and
# NEVER goes to the client — there is no client recipient in this workflow.
#
# Separate from daily.yml on purpose: the daily fire is a single Mon-Fri 8 AM
# fire (2026-07-21 — the Friday wrap-up was removed); this is its own cadence +
# deliverable. It reads tracking-data-v2.json from the blob store, which the
# daily fires keep current (each ingests the last 14 days), so the previous
# Mon-Fri week is present by the time this runs.
#
# DST: 5:07 AM ET = 09:07 UTC (EDT) / 10:07 UTC (EST); the gate proceeds on the
# one matching the current ET offset so DST never doubles. dow 1 = Monday.

on:
  schedule:
    - cron: "7 9 * * 1"     # ~5:07 AM EDT, Monday
    - cron: "7 10 * * 1"    # ~5:07 AM EST, Monday (gated out in EDT)
  workflow_dispatch:
    inputs:
      send_to:
        description: "Recipients (test = Michael only)"
        required: false
        default: "test"
        type: choice
        options:
          - test
          - full
      start:
        description: "Catch-up start date YYYY-MM-DD (blank = normal previous-week anchor)"
        required: false
        default: ""
        type: string
      end:
        description: "Catch-up end date YYYY-MM-DD, inclusive (required with start)"
        required: false
        default: ""
        type: string
      force_send:
        description: "Override the mailbox guard for THIS run (only when a preview already burned the subject)"
        required: false
        default: false
        type: boolean

concurrency:
  # SAME group as daily.yml. These two jobs share one blob store: weekly pulls
  # state at the start of its run, and if the daily fire wrote new state in
  # between, weekly's push used to upload its stale snapshot over it — a silent
  # last-writer-wins revert of a whole day's ingest. One group serializes them.
  group: hilmar-daily-fire
  cancel-in-progress: false

env:
  HILMAR_REPORTS_PAUSED: "false"
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  weekly:
    name: Weekly exec summary (Mon 5 AM ET, previous week)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      QT_APP_PASSWORD: ${{ secrets.QT_APP_PASSWORD }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      GRAPH_APP_TENANT_ID: ${{ secrets.GRAPH_APP_TENANT_ID }}
      GRAPH_APP_CLIENT_ID: ${{ secrets.GRAPH_APP_CLIENT_ID }}
      GRAPH_APP_CLIENT_SECRET: ${{ secrets.GRAPH_APP_CLIENT_SECRET }}
      HILMAR_NONINTERACTIVE: "1"
      # Scheduled runs go to the full staff list; a manual dispatch honors
      # send_to (default test = Michael only).
      SEND_TO: ${{ github.event_name == 'schedule' && 'full' || github.event.inputs.send_to }}
    steps:
      - id: gate
        # Proceed only on the DST-correct Monday tick (manual dispatch always
        # proceeds). Keying on offset (not wall-clock) survives GitHub's
        # multi-hour cron lateness.
        run: |
          # HARD STOP FIRST, for EVERY event type. Michael 2026-08-03
          # "make it stop  zero to go out" — so a manual dispatch cannot send
          # either. Placed before the dispatch branch on purpose: putting it
          # after would leave dispatch open, which is what "zero" rules out.
          # Pausing means BOTH this flag and the cron triggers above — this
          # workflow is the one that proved a flag alone is not enough.
          # RESUMED 2026-08-04 — Michael: "crons back on".
          if [ "$HILMAR_REPORTS_PAUSED" = "true" ]; then
            echo "::warning::Hilmar reports are HARD-STOPPED — weekly summary suppressed by ANY trigger, nothing sent."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual dispatch — gate open."; echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          offset=$(TZ=America/New_York date +%z)
          cron_hour=$(echo "${{ github.event.schedule }}" | awk '{print $2}')
          proceed=false
          if [ "$offset" = "-0400" ] && [ "$cron_hour" = "9" ];  then proceed=true; fi
          if [ "$offset" = "-0500" ] && [ "$cron_hour" = "10" ]; then proceed=true; fi
          echo "offset=$offset cron_hour=$cron_hour → proceed=$proceed"
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Refuse if secrets missing
        if: steps.gate.outputs.proceed == 'true'
        run: |
          for v in AZURE_STORAGE_CONNECTION_STRING; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v not set — weekly blocked"; exit 1; fi
          done

      - uses: actions/checkout@v5
        if: steps.gate.outputs.proceed == 'true'

      - name: Set up Python 3.12
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install reportlab msal requests tzdata jinja2 sentry-sdk azure-storage-blob

      - name: Materialize secret files
        if: steps.gate.outputs.proceed == 'true'
        run: |
          mkdir -p secrets
          printf '%s' "$SENTRY_DSN"      > secrets/sentry-dsn.txt
          printf '%s' "$QT_APP_PASSWORD" > secrets/quote-tracker-pwd.txt

      - name: Pull pipeline state from blob store
        if: steps.gate.outputs.proceed == 'true'
        # tracking-data-v2.json + the delegated token cache the send needs.
        run: python3 scripts/state_store.py pull

      - name: Build the exec summary
        if: steps.gate.outputs.proceed == 'true'
        env:
          PERIOD_START: ${{ github.event.inputs.start }}
          PERIOD_END: ${{ github.event.inputs.end }}
        # --force: this workflow IS the Monday trigger, so always generate;
        # gen_weekly_summary anchors on the prior week regardless of the exact
        # weekday it runs.
        #
        # A manual dispatch may pass start/end to report an explicit window
        # instead — used to recover a period the daily fires missed, where the
        # previous-week anchor would report one week and leave the rest dark.
        # Bad dates exit 2 from the generator and fail the step; nothing is
        # sent, because the send step reads files this step must write.
        run: |
          if [ -n "$PERIOD_START" ] || [ -n "$PERIOD_END" ]; then
            echo "Explicit period: '$PERIOD_START' → '$PERIOD_END'"
            python3 scripts/gen_weekly_summary.py --start "$PERIOD_START" --end "$PERIOD_END"
          else
            python3 scripts/gen_weekly_summary.py --force
          fi

      - name: Send the exec summary (INTERNAL staff list only)
        if: steps.gate.outputs.proceed == 'true'
        env:
          FORCE_SEND: ${{ github.event.inputs.force_send }}
        run: |
          if [ ! -f reports/weekly-summary.html ]; then
            echo "::error::weekly-summary.html not generated — nothing to send"; exit 1
          fi
          # The SUBJECT comes from the generator (scripts/gen_weekly_summary.py
          # _subject_for), not from shell date math. It has to describe the
          # period the HTML actually covers: this subject is what the
          # cross-host mailbox guard dedupes on, so a subject computed from a
          # second clock can suppress a real send or double a sent one.
          if [ ! -s reports/weekly-subject.txt ]; then
            echo "::error::weekly-subject.txt missing or empty — refusing to send an unlabeled summary"; exit 1
          fi
          echo "SUBJECT: $(cat reports/weekly-subject.txt)"
          if [ "$SEND_TO" = "full" ]; then
            echo "FULL staff distribution (config.json distribution.full_list)"
            # force_send exists for ONE situation: a preview already went out
            # under this exact subject BEFORE --verification tagging existed,
            # so the mailbox guard would suppress the real send and then write
            # a weekly-sent flag claiming it shipped. Defaults false, and with
            # [VERIFY] tagging in place a new collision should be impossible —
            # if you find yourself reaching for this, ask what re-burned the
            # subject rather than reaching again.
            FORCE_FLAG=""
            if [ "$FORCE_SEND" = "true" ]; then
              FORCE_FLAG="--force"
              echo "::warning::force_send=true — mailbox guard bypassed for this run. Check the mailbox afterwards for a duplicate."
            fi
            python3 scripts/outlook_send.py daily --to-from-config $FORCE_FLAG \
              --flag-name weekly-sent \
              --subject-from-file reports/weekly-subject.txt \
              --body-from-file reports/weekly-summary.html
          else
            echo "VERIFICATION send — michael.deitchman@idealx.us only"
            # --verification tags the subject [VERIFY] and implies
            # --force --no-flag. Without the tag this copy reuses the REAL
            # subject, and the cross-host mailbox guard then treats the later
            # staff send as a duplicate: it returns 0, sends nothing, and
            # writes a weekly-sent flag recording a delivery that never
            # happened. That is what blocked 2026-07-30's staff send.
            python3 scripts/outlook_send.py daily --to michael.deitchman@idealx.us \
              --verification \
              --subject-from-file reports/weekly-subject.txt \
              --body-from-file reports/weekly-summary.html
          fi

      - name: Push state back (weekly-sent flag)
        if: steps.gate.outputs.proceed == 'true' && env.SEND_TO == 'full'
        # Weekly owns its OWN flag and nothing else. It never mutates
        # tracking-data-v2.json, so it must not upload it.
        run: python3 scripts/state_store.py push --only weekly-sent
