name: Re-consent the Graph token

# MANUAL ONLY, and it needs a human with a browser for ~1 minute.
#
# 2026-08-07. diag_day run 6 proved the pipeline reads /me — Michael's own
# mailbox — and not MBD_OceanExportBookingShared, where Lonny addresses his
# RFQs. Reading another mailbox with a DELEGATED token requires the
# Mail.Read.Shared scope, and the cached token consented to Mail.Send +
# Mail.Read + Files.ReadWrite only. This job re-runs the consent with the
# wider set (outlook_send.AUTH_SCOPES).
#
# The Cloud PC is decommissioned and this does NOT need it. Device-code auth
# needs a BROWSER, not a particular machine — any device you read email on.
#
# The code is EMAILED to you when the run starts, so there is nothing to find:
#
#   1. Dispatch (or let Claude dispatch it).
#   2. Open the email "Hilmar tracker — sign-in code XXXXXXXXX".
#   3. Tap the button, enter the code, sign in as michael.deitchman@ol-usa.com.
#   4. The run finishes on its own: pushes the cache, then prints the mailboxes
#      refresh_stage will read, so the scope is proven rather than assumed.
#
# The code expires in ~15 minutes. It is single-use and worthless to anyone who
# cannot also complete the Microsoft sign-in as you — which is exactly why this
# step cannot be automated away, no matter whose browser drives it.
#
# WRITES: secrets/token-cache.bin in the blob store, and ONLY that — the push
# is filtered with `only`, so this job cannot round-trip a stale copy of
# tracking-data over a fresh one the way the weekly job once did. It pushes
# only after a successful consent; a failed or abandoned auth leaves the
# existing cache untouched.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type REAUTH to confirm — this replaces the stored token"
        required: true
        default: ""
      notify:
        description: "Where to email the sign-in code"
        required: true
        default: "michael.deitchman@ol-usa.com"

permissions:
  contents: read

jobs:
  reauth:
    name: Device-code consent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: inputs.confirm == 'REAUTH'
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # msal for the device flow, azure-storage-blob for the state store —
        # see tests/test_diag_day.py for why every state_store workflow names
        # the storage SDK explicitly.
        run: python -m pip install --quiet msal requests tzdata azure-storage-blob

      - name: Pull the existing token cache
        # So MSAL re-consents the SAME account rather than creating a second
        # one, and so a failed auth can be abandoned with nothing lost.
        run: python3 -c "import sys; sys.path.insert(0,'scripts'); import state_store; print(state_store.pull())"

      - name: Authenticate
        # EMAILS the code first, then blocks polling Microsoft until it is
        # approved. Michael, 2026-08-07, on being told to fetch a code out of
        # an Actions log: "what am i doing from my phone and where.. you do
        # it." The sign-in cannot be delegated — that is the entire security
        # property of device-code flow, and Microsoft returns no pre-filled
        # link for this client (verified against the live endpoint). The
        # hunting can be: the code lands in his inbox before the wait starts.
        run: python3 scripts/auth_notify.py --to "${{ inputs.notify }}"

      - name: Push the refreshed cache — and only the cache
        if: success()
        run: |
          python3 -c "
          import sys; sys.path.insert(0,'scripts')
          import state_store
          print('pushed:', state_store.push(only=['token-cache']))
          "

      - name: Confirm the new consent covers the shared mailbox
        if: success()
        # Proves the scope actually landed instead of assuming it did. Prints
        # the mailboxes refresh_stage would now read.
        run: |
          python3 -c "
          import sys; sys.path.insert(0,'scripts')
          import refresh_stage as RS
          tok = RS.get_token()
          for label, base, _ in RS.read_targets(tok):
              print(f'  will read: {label}  ->  {base}')
          "
