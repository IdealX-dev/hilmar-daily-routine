# TEMPORARY recovery kicker — 2026-07-11, pushed on Michael's explicit
# written approval ("send it") after GitHub's cron scheduler skipped BOTH
# of tonight's daily.yml ticks and the liveness backstop's evening tick.
#
# Fires on push to the dev branch and dispatches the real production fire
# (send_to=full) with the default token (actions: write) — the same
# mechanism daily.yml's own heartbeat step uses. Idempotent-safe: the
# blob-synced sent-flag + cross-host mailbox guard no-op any duplicate if
# the stalled cron also lands. concurrency group serializes runs.
#
# DELETE THIS FILE once tonight's report is confirmed delivered.
name: Kick daily fire (temporary recovery)

on:
  push:
    branches:
      - claude/pr-65-passoff-docs-0rjg0y

permissions:
  actions: write
  contents: read

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch tonight's production fire on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run daily.yml --ref main -R "${{ github.repository }}" \
            -f mode=production-fire -f send_to=full -f force_resend=false
          echo "Dispatched daily.yml production-fire (send_to=full) on main."
