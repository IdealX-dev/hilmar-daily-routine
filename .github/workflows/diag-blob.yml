name: Diagnose blob state store

# MANUAL ONLY. Runs scripts/diag_blob.py on a runner, which is the only place
# AZURE_STORAGE_CONNECTION_STRING exists. Answers the 2026-07-28 question:
# the state store can be READ but not WRITTEN, and the daily fire dies at the
# snapshot-backup step before the pipeline ever runs.
#
# Read-only except for uniquely-named probe blobs under a `_diag/` prefix,
# uploaded with overwrite=False and deleted on the way out. It cannot touch
# real state. It never prints the connection string, the account key, or a SAS
# signature.

on:
  workflow_dispatch:
    inputs:
      window_date:
        description: "Report date to inspect (YYYY-MM-DD). Blank = latest present."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  diagnose:
    name: Probe the blob state store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the storage SDK
        # msal + requests + tzdata joined 2026-08-14: the shared-mailbox probe
        # imports refresh_stage, which needs all three.
        run: python -m pip install --quiet azure-storage-blob msal requests tzdata

      - name: Probe
        run: python3 scripts/diag_blob.py

      - name: Inspect the report rows (read-only)
        # Answers the 2026-07-30 question: rows show a carrier + rate under
        # PENDING HILMAR while OL-USA RESPONSES renders empty. gen_email
        # buckets OL responses on response_timestamp, so a quoted row without
        # one is invisible there forever. Reads only.
        env:
          DIAG_WINDOW_DATE: ${{ inputs.window_date }}
        run: python3 scripts/diag_rows.py

      - name: Propose RFQ links for the standalone bookings (read-only)
        # Michael 2026-08-13: "the 49 you should be able to match up the
        # vessel, container quantities and lanes by the emails from lonny and
        # the team suggestions".
        #
        # Lives here rather than in its own workflow because a workflow file
        # has to exist on the DEFAULT branch before it can be dispatched at
        # all, and diag-standalones.yml does not yet — dispatching it 404s.
        # This job already pulls the same state, so the step costs one extra
        # read of a temp dir. When diag-standalones.yml reaches the default
        # branch this can move back out.
        #
        # Writes nothing: it prints candidates and the evidence behind each.
        run: python3 scripts/diag_match_standalones.py

      - name: Why is the signer blank, and is the rate what OL wrote (read-only)
        # 2026-08-20, Michael on the OL-USA RESPONSES table: "why are signors
        # missing nothing should be missing.. also the numbers are wrong for
        # $". Neither question is answerable from the rendered table — that
        # shows what was PARSED, and the question is how it compares to what
        # the email SAID. This pairs each recent quoted row with its cached
        # body and prints the signature tail plus every currency-shaped number
        # in the text beside the stored ol_rate.
        #
        # ol_responder_signer has no completeness gate: QC-027 covers
        # ETD/ETA/Vessel/Rate/Carrier/POL/POD and not this, so a blank is
        # silent. Writes nothing.
        if: always()
        # `|| true` keeps a diagnostic from failing the job, but on
        # 2026-08-20 it also hid a FileNotFoundError on the very first
        # line — the step went GREEN having printed nothing. The script
        # now emits ::error:: and a non-zero exit on any pull failure,
        # and this echoes the exit code so a silent death is visible in
        # the log rather than inferred from a suspiciously fast step.
        run: |
          python3 scripts/diag_signer_and_rate.py --days 7 --limit 12
          rc=$?
          [ "$rc" -ne 0 ] && echo "::error::diag_signer_and_rate exited $rc"
          exit 0

      - name: Find the real booked dates for back-entered wins (read-only)
        # continue-on-error, NOT `exit 0` (Copilot review on #224, and it is
        # right). Swallowing the exit code made the STEP green over a real
        # failure — the exact shape of the 2026-08-20 defect where a
        # diagnostic died on its first line and the step reported success in
        # zero seconds. continue-on-error keeps the remaining diag steps
        # running, which is why `exit 0` was there, while letting this step
        # show RED when the script actually fails.
        continue-on-error: true
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python3 scripts/diag_booking_dates.py

      - name: Probe the shared mailbox endpoint by endpoint (read-only)
        # 2026-08-14, Michael: "you did get the authorizaton you needed.. you
        # are wrong." This settles whether the shared mailbox is unreadable or
        # only the mailbox-wide /messages endpoint is (the AllItems quirk) —
        # folder list, inbox read, sentitems read, then the failing endpoint
        # for the record. Never fails the job; the output IS the deliverable.
        if: always()
        run: python3 scripts/diag_shared_mailbox.py || true

      - name: Trace QC-069 duplicate MDOLX refs, mechanism by mechanism (read-only)
        # 2026-09-03: QC-069 flags 11 duplicate_mdolx pairs (one shipment
        # stored twice). Before writing a heal — collapsing the wrong row is
        # destructive, per QC-069's own docstring — this settles WHICH
        # mechanism produced each pair, and a heal is scoped from its tally.
        #
        # NO `|| true`. It had one until 2026-09-03, and that is the exact
        # pattern CLAUDE.md names as the 2026-08-20 defect: "A diagnostic that
        # cannot fail loudly is worse than none ... one died on its first line
        # and the step went green in zero seconds because of a trailing
        # `|| true`." This step's whole purpose is to produce a number a heal
        # gets scoped from, so a silent green here is worse than most: it
        # would leave the previous run's tally standing as if it were current.
        # The script already emits `::error::` and returns 2 on a failed pull;
        # `|| true` threw that exit code away. `if: always()` is what keeps
        # the step running when an EARLIER step failed — that is the part
        # worth having, and it is kept.
        if: always()
        run: python3 scripts/diag_duplicate_mdolx.py

      - name: Size the parity change before it ships (read-only)
        # Answers the one question blocking PR #254: production's
        # decide_status now reads the UNION of mdolx_ref + mdolx_refs_all, and
        # nobody has measured how many live rows that moves. It is not
        # cosmetic — booking_count gates on the STORED status, so a flipped
        # row changes wins, win_rate and TEU, and gen_client_email renders
        # is_confirmed_win rows under "Your confirmed bookings".
        #
        # daily.yml:381 resolves SEND_TO to 'full' for github.event_name ==
        # 'schedule', so the send_to=test default guards MANUAL dispatch only
        # and a scheduled fire always goes to the whole distribution. Michael
        # should see N before the numbers reach Lonny, not after.
        #
        # Read-only: pulls to a temp dir, computes every decision on copies,
        # writes no blob and sends nothing. NO `|| true` — the script emits
        # ::error:: and returns 2, and throwing that away is the 2026-08-20
        # defect CLAUDE.md names.
        if: always()
        run: python3 scripts/diag_refs_all_only.py
