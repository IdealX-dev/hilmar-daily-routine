name: Diagnose blob state store

# MANUAL ONLY. Runs scripts/diag_blob.py on a runner, which is the only place
# AZURE_STORAGE_CONNECTION_STRING exists. Answers the 2026-07-28 question:
# the state store can be READ but not WRITTEN, and the daily fire dies at the
# snapshot-backup step before the pipeline ever runs.
#
# Read-only except for uniquely-named probe blobs under a `_diag/` prefix,
# uploaded with overwrite=False and deleted on the way out. It cannot touch
# real state. It never prints the connection string, the account key, or a SAS
# signature.

on:
  workflow_dispatch:
    inputs:
      window_date:
        description: "Report date to inspect (YYYY-MM-DD). Blank = latest present."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  diagnose:
    name: Probe the blob state store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the storage SDK
        run: python -m pip install --quiet azure-storage-blob

      - name: Probe
        run: python3 scripts/diag_blob.py

      - name: Inspect the report rows (read-only)
        # Answers the 2026-07-30 question: rows show a carrier + rate under
        # PENDING HILMAR while OL-USA RESPONSES renders empty. gen_email
        # buckets OL responses on response_timestamp, so a quoted row without
        # one is invisible there forever. Reads only.
        env:
          DIAG_WINDOW_DATE: ${{ inputs.window_date }}
        run: python3 scripts/diag_rows.py

      - name: Propose RFQ links for the standalone bookings (read-only)
        # Michael 2026-08-13: "the 49 you should be able to match up the
        # vessel, container quantities and lanes by the emails from lonny and
        # the team suggestions".
        #
        # Lives here rather than in its own workflow because a workflow file
        # has to exist on the DEFAULT branch before it can be dispatched at
        # all, and diag-standalones.yml does not yet — dispatching it 404s.
        # This job already pulls the same state, so the step costs one extra
        # read of a temp dir. When diag-standalones.yml reaches the default
        # branch this can move back out.
        #
        # Writes nothing: it prints candidates and the evidence behind each.
        run: python3 scripts/diag_match_standalones.py
