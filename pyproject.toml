[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hilmar-tracker"
version = "0.1.0"
description = "OL-USA daily Hilmar Ingredients rate-desk tracker — ingest, classify, render, send"
readme = "README.md"
# Pinned to 3.12 — the single version CI (.github/workflows/test.yml),
# .python-version, the Cloud PC interpreter, and QC-061 all consume. The box
# silently drifted to 3.14 (untested) for a week; the upper bound makes the
# toolchain itself reject an unvalidated interpreter. Bump deliberately, in
# lockstep with CI + .python-version, never by accident.
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary — IdealX / OL-USA internal" }
authors = [
  { name = "Michael Deitchman", email = "michael.deitchman@idealx.us" },
]
dependencies = [
  "msal>=1.28",                # Microsoft auth (confidential client)
  "azure-identity>=1.16",      # DefaultAzureCredential — Key Vault future-proofing
  "azure-keyvault-secrets>=4.8",
  "requests>=2.32",            # Graph REST calls
  "weasyprint>=62",            # PDF rendering (deploy-time / future)
  "reportlab>=4.0",            # PDF rendering (no GTK; used by render.py)
  "anthropic>=0.40",           # LLM narrative for daily insights (M3.11.b)
  "jinja2>=3.1",               # HTML templating
  "python-dateutil>=2.9",
  "tzdata>=2024.1",
  "jsonschema>=4.22",
  "pdfplumber>=0.11",          # booking-PDF parsing (QC-054 requires it; was undeclared)
  "sentry-sdk>=2.0",           # observability (QC-054 requires it; was undeclared — the silent gap)
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "responses>=0.25",           # mock Graph HTTP calls
  "ruff>=0.4",                 # lint + format
  "mypy>=1.10",
]

[project.scripts]
hilmar-run        = "hilmar.orchestrator:main"
hilmar-ingest     = "hilmar.ingest:main"
hilmar-qc         = "hilmar.qc:main"
hilmar-render     = "hilmar.render:main"
hilmar-send       = "hilmar.send:main"
hilmar-auth-login = "hilmar.graph_client:cli_main"
hilmar-feedback   = "hilmar.feedback_ingest:main"
hilmar-backfill   = "hilmar.backfill:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hilmar = ["templates/*.j2", "templates/*.html", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# `live_floor` marks the one test that reads the PRODUCTION value of
# core.TIMING_VALID_FROM instead of the armed value the rest of
# test_timing_reset.py monkeypatches in. Registered because addopts carries
# --strict-markers, which turns an unknown marker into an error rather than a
# warning — deliberately, so a typo cannot silently disable a test.
markers = [
    "live_floor: reads the live TIMING_VALID_FROM, not the armed test value",
]
# pythonpath = ["."] is belt-and-suspenders alongside the direct-conftest
# imports introduced in commit a983e33. The repo root on sys.path means
# `from tests.conftest import ...` ALSO resolves (in addition to the
# bare `from conftest import ...` pattern that pytest natively supports
# via its rootdir mechanism). On Windows the rootdir mechanism happens
# to add the project root to sys.path so both forms worked locally; on
# Linux CI it didn't, which is what broke the runs before a983e33.
# Keeping both fixes in place avoids regression on either OS in future.
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=hilmar --cov-report=term-missing --cov-fail-under=90"
# SCOPE (be honest about what this 90% measures): the gate covers `--cov=hilmar`
# = the src/hilmar/ LIBRARY tree only. PRODUCTION runs scripts/ (CLAUDE.md §2),
# which is NOT under this gate and is far lower (~27% total; the deliverable
# steps patch_carriers/gen_dashboard/gen_pdf had 0% until smoke/contract tests
# were added). Bringing scripts/ under an enforced floor is a deliberate policy
# decision (it would drop combined coverage well below 90 and break CI), tracked
# separately — not something to bolt onto this line. Treat "90% covered" as a
# statement about the library, not the production pipeline.
# NOTE: coverage gate is a ONE-WAY RATCHET — only bump up, never lower it to
# make a failing run pass. Per Michael 2026-05-28 "push toward 100%":
#   - 77 (M3.8 interim floor) → 85 (M3.x restore) → 87 (2026-05-28 AM)
#   - 90 (2026-05-28 PM) after parser pushes:
#       parser_accuracy.py  0%   → 97.8%
#       parser_fallback.py  88%  → 99.0%
#       body_parser.py      87%  → 88.7%   (regex edge-case branches remain)
#       ingest.py           74%  → 86.7%   (apply_send_signals carrier-fallback +
#                                            container-spec recovery now tested)
# Next-rung target 92: push body_parser.py + orchestrator.py (84.2%) +
# feedback_ingest.py (86.4%). Bottom by stmts*gap is still ingest.py
# (99 missing of 744) — biggest absolute test-debt remaining.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# E501: line length handled by formatter.
# E701/E702: compact one-liners (`if x: return`, `print(...); return 0`) are
# this codebase's established style — hundreds of intentional sites.
ignore = ["E501", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# Pipeline scripts and tests bootstrap sys.path / env BEFORE imports
# (scripts/ isn't a package; tests import the scripts tree directly), so
# module-level imports legitimately follow code. src/hilmar/ is a real
# package and gets NO exemption.
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
"deploy/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
